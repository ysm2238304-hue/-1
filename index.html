<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">

    <title>南投縣清潔考核地圖系統</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet Map CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap');

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #020617; /* Slate 950 */
            color: #f8fafc;
            overflow: hidden;
            margin: 0;
            padding: 0;
            touch-action: pan-x pan-y; /* Prevent pull-to-refresh on mobile */
        }

        /* 玻璃擬物化效果 (Glassmorphism) */
        .glass {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5);
        }

        /* 歡迎頁動畫 */
        #splash-screen {
            transition: opacity 0.8s ease-in-out, visibility 0.8s ease-in-out;
        }
        .pulse-ring {
            animation: pulse 2s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
        }
        @keyframes pulse {
            0% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(6, 182, 212, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 20px rgba(6, 182, 212, 0); }
            100% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(6, 182, 212, 0); }
        }

        /* 隱藏 Leaflet 預設的版權文字以提升介面乾淨度 (僅測試用) */
        .leaflet-control-attribution { display: none !important; }
        .leaflet-control-zoom { border: none !important; margin-top: 80px !important; }
        .leaflet-bar a { background-color: rgba(30, 41, 59, 0.8) !important; color: #06b6d4 !important; border-color: rgba(255,255,255,0.1) !important;}

        /* 自訂底部面板過渡動畫 */
        .bottom-sheet {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .bottom-sheet.hidden-sheet {
            transform: translateY(100%);
        }

        /* 滾動條隱藏 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        /* 路線顏色定義 */
        .route-1-color { color: #06b6d4; } /* Cyan */
        .route-2-color { color: #d946ef; } /* Fuchsia */
        .route-3-color { color: #84cc16; } /* Lime */
        
        /* 永久顯示的標籤 (Tooltip) 樣式 */
        .glass-tooltip {
            background: rgba(15, 23, 42, 0.85) !important;
            backdrop-filter: blur(4px) !important;
            -webkit-backdrop-filter: blur(4px) !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            color: #f8fafc !important;
            border-radius: 8px !important;
            padding: 5px 10px !important;
            font-size: 12px !important;
            font-weight: 500 !important;
            line-height: 1.4 !important;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5) !important;
            white-space: nowrap !important;
        }
        .leaflet-tooltip-top.glass-tooltip::before { border-top-color: rgba(15, 23, 42, 0.85) !important; }
        .leaflet-tooltip-bottom.glass-tooltip::before { border-bottom-color: rgba(15, 23, 42, 0.85) !important; }
        .leaflet-tooltip-left.glass-tooltip::before { border-left-color: rgba(15, 23, 42, 0.85) !important; }
        .leaflet-tooltip-right.glass-tooltip::before { border-right-color: rgba(15, 23, 42, 0.85) !important; }
        
        /* 智慧縮放隱藏標籤 */
        .hide-tooltips .glass-tooltip {
            opacity: 0 !important;
            visibility: hidden !important;
            transition: opacity 0.3s ease;
        }
        
        /* 使用者當前位置光點 (呼吸燈效果) */
        .user-location-marker {
            background-color: #3b82f6; 
            border: 2px solid white;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.8);
            position: relative;
            z-index: 1000;
        }
        .user-pulse {
            position: absolute;
            top: -8px;
            left: -8px;
            width: 32px;
            height: 32px;
            background-color: rgba(59, 130, 246, 0.6);
            border-radius: 50%;
            animation: user-ping 1.5s cubic-bezier(0, 0, 0.2, 1) infinite;
        }
        @keyframes user-ping {
            75%, 100% {
                transform: scale(2);
                opacity: 0;
            }
        }
    </style>
</head>
<body class="w-screen h-screen relative">

    <!-- 1. 歡迎頁 (Splash Screen) -->

        <div class="mt-12 text-cyan-500/50 text-sm animate-pulse">系統載入中 System Loading...</div>
    </div>

    <!-- 2. 主畫面 (地圖容器) -->
    <div id="map" class="absolute inset-0 z-0"></div>

            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-bold flex items-center gap-2">
                    <i class="ph-fill ph-target text-cyan-400"></i>
                    <span id="header-title">請選擇考核鄉鎮</span>
                </h2>
                <button class="glass p-2 rounded-full text-slate-300 hover:text-white" onclick="map.fitBounds(currentBounds)">
                    <i class="ph ph-corners-out text-lg"></i>
                </button>
            </div>
            
            <!-- 鄉鎮橫向捲動選單 -->
            <div class="flex gap-3 overflow-x-auto no-scrollbar py-2" id="township-selector">
                <!-- JavaScript 動態生成按鈕 -->
            </div>
        </div>

        <!-- 底部：資訊面板 (Bottom Sheet) -->
        <div id="bottom-sheet" class="pointer-events-auto bottom-sheet hidden-sheet glass-panel w-full rounded-t-3xl p-5 pb-8 shadow-2xl">
            <div class="w-12 h-1.5 bg-slate-600 rounded-full mx-auto mb-4"></div>
            
            <div id="sheet-content">
                <h3 class="text-xl font-bold mb-1 text-white" id="sheet-title">點位名稱</h3>
                <p class="text-sm text-slate-400 mb-5" id="sheet-desc">點擊地圖上的路線或圖示查看詳細資訊</p>
                
                <button id="nav-btn" class="w-full bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-bold py-3.5 px-4 rounded-xl flex items-center justify-center gap-2 shadow-[0_0_20px_rgba(6,182,212,0.3)] transition-all active:scale-95 hidden">
                    <i class="ph-fill ph-navigation-arrow text-xl"></i>
                    <span>開啟 Google Maps 導航</span>
                </button>
            </div>
        </div>

        <!-- 實時定位按鈕 (Locate Me) -->
        <button id="locate-btn" class="pointer-events-auto absolute bottom-8 right-4 z-[1000] glass p-3 rounded-full text-cyan-400 hover:text-white hover:bg-slate-800 shadow-[0_0_15px_rgba(6,182,212,0.3)] transition-all active:scale-95" onclick="locateUser()">
            <i class="ph-fill ph-crosshair text-2xl"></i>
        </button>

        <!-- KML 匯入按鈕 -->
        <button class="pointer-events-auto absolute bottom-24 right-4 z-[1000] glass p-3 rounded-full text-fuchsia-400 hover:text-white hover:bg-slate-800 shadow-[0_0_15px_rgba(217,70,239,0.3)] transition-all active:scale-95" onclick="document.getElementById('kml-upload').click()" title="匯入您的 KML 點位">
            <i class="ph-fill ph-folder-open text-2xl"></i>
        </button>
        <input type="file" id="kml-upload" accept=".kml,.xml" class="hidden" onchange="handleKMLUpload(event)" multiple>
    </div>

                            <i class="${iconName}"></i>
                        </div>
                    </foreignObject>
                </svg>
            `;
            return L.divIcon({
                className: 'custom-leaflet-icon',
                html: svgTemplate,
                iconSize: [40, 40],
                iconAnchor: [20, 20]
            });
        };

            // 套用深色科技感圖資 (CartoDB Dark Matter)
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
                subdomains: 'abcd',
                maxZoom: 20
            }).addTo(map);
            
            // 加入智慧縮放監聽器：拉遠時自動隱藏標籤防重疊
            map.on('zoomend', function() {
                const mapContainer = document.getElementById('map');
                if (map.getZoom() < 14) {
                    mapContainer.classList.add('hide-tooltips');
                } else {
                    mapContainer.classList.remove('hide-tooltips');
                }
            });
        }

        // --- GPS 精準定位功能 ---
        function locateUser() {
            const btnIcon = document.querySelector('#locate-btn i');
            // 切換為載入中動畫
            btnIcon.className = "ph ph-spinner animate-spin text-2xl text-amber-400"; 

            if (!navigator.geolocation) {
                alert("您的瀏覽器不支援地理定位功能！");
                btnIcon.className = "ph-fill ph-crosshair text-2xl text-cyan-400";
                return;
            }

            // 請求高精度 GPS 權限
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;

                    // 若已有舊定位點，先移除
                    if (userMarker) {
                        map.removeLayer(userMarker);
                    }

                    // 建立自訂的「藍色呼吸燈」光點
                    const userIcon = L.divIcon({
                        className: 'custom-user-icon',
                        html: `<div class="relative"><div class="user-pulse"></div><div class="user-location-marker"></div></div>`,
                        iconSize: [16, 16],
                        iconAnchor: [8, 8]
                    });

                    // 放置標記並加上 Tooltip
                    userMarker = L.marker([lat, lng], { icon: userIcon, zIndexOffset: 1000 }).addTo(map);
                    userMarker.bindTooltip('<span class="text-blue-300 font-bold">📍 我的位置</span>', {
                        permanent: true,
                        direction: 'top',
                        className: 'glass-tooltip',
                        offset: [0, -10]
                    });

                    // 地圖視角平滑飛向使用者當前位置並放大
                    map.flyTo([lat, lng], 16, { animate: true, duration: 1.5 });
                    
                    // 恢復按鈕圖示
                    btnIcon.className = "ph-fill ph-crosshair text-2xl text-cyan-400"; 
                },
                (error) => {
                    console.error("定位錯誤:", error);
                    alert("無法獲取您的位置！請確認：\n1. 手機「定位/GPS」已開啟\n2. 允許瀏覽器取用位置權限");
                    btnIcon.className = "ph-fill ph-crosshair text-2xl text-cyan-400";
                },
                {
                    enableHighAccuracy: true, // 強制使用高精度 GPS (如硬體支援)
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }

        // --- KML 檔案匯入解析功能 ---
        function handleKMLUpload(event) {
            const files = event.target.files;
            if(!files.length) return;

            document.querySelector('#header-title').innerText = "載入自訂 KML 中...";

            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const text = e.target.result;
                    parseAndRenderKML(text);
                };
                reader.readAsText(file);
            });
            
            // 清空 input 讓下次可以重複選擇同個檔案
            event.target.value = '';
        }

        function parseAndRenderKML(kmlText) {
            const parser = new DOMParser();
            const xml = parser.parseFromString(kmlText, "text/xml");
            const placemarks = xml.querySelectorAll("Placemark");
            
            const kmlBounds = [];

            // 為了不與內建資料混淆，匯入的 KML 我們套用獨立的顏色
            placemarks.forEach(p => {
                const name = p.querySelector("name")?.textContent || "未命名點位";
                
                // 過濾掉可能夾帶的 HTML 標籤
                let rawDesc = p.querySelector("description")?.textContent || "自訂匯入位置";
                const tempDiv = document.createElement("div");
                tempDiv.innerHTML = rawDesc;
                const desc = tempDiv.textContent || tempDiv.innerText || "";

                // 解析點位 (Point)
                const pointCoord = p.querySelector("Point coordinates")?.textContent;
                if (pointCoord) {
                    const [lng, lat] = pointCoord.trim().split(',').map(Number);
                    if (lat && lng) {
                        const marker = L.marker([lat, lng], { icon: icons.start }).addTo(map);
                        marker.bindTooltip(`<span class="text-fuchsia-400 font-bold">${name}</span>`, {
                            permanent: true, direction: 'top', className: 'glass-tooltip', offset: [0, -20]
                        });
                        marker.on('click', () => showBottomSheet(name, desc, lat, lng));
                        activeLayers.push(marker);
                        kmlBounds.push([lat, lng]);
                    }
                }

                // 解析自訂路線 (LineString)
                const lineCoord = p.querySelector("LineString coordinates")?.textContent;
                if (lineCoord) {
                    const coords = lineCoord.trim().split(/\s+/).map(pair => {
                        const [lng, lat] = pair.split(',').map(Number);
                        return [lat, lng];
                    }).filter(c => !isNaN(c[0]) && !isNaN(c[1]));
                    
                    if (coords.length > 0) {
                        const polyline = L.polyline(coords, {
                            color: '#d946ef', // Fuchsia 色
                            weight: 5,
                            opacity: 0.9,
                            dashArray: '10, 10'
                        }).addTo(map);
                        polyline.bindTooltip(`<span class="text-white font-bold">${name}</span>`, {
                            permanent: true, direction: 'center', className: 'glass-tooltip'
                        });
                        polyline.on('click', () => showBottomSheet(name, desc, coords[0][0], coords[0][1]));
                        activeLayers.push(polyline);
                        kmlBounds.push(...coords);
                    }
                }
            });

            // 將地圖鏡頭移動到匯入的範圍
            if (kmlBounds.length > 0) {
                currentBounds = L.latLngBounds(kmlBounds);
                map.fitBounds(currentBounds, { padding: [50, 50], animate: true, duration: 1.5 });
                document.querySelector('#header-title').innerText = "預覽：您的自訂 KML 地圖";
                hideBottomSheet();
            }
        }

        // --- UI 控制與互動 ---
        const bottomSheet = document.getElementById('bottom-sheet');
        const sheetTitle = document.getElementById('sheet-title');
        const sheetDesc = document.getElementById('sheet-desc');
        const navBtn = document.getElementById('nav-btn');

        function showBottomSheet(title, desc, lat, lng) {
            sheetTitle.innerText = title;
            sheetDesc.innerHTML = desc;
            
            navBtn.classList.remove('hidden');
            navBtn.onclick = () => {
                // 喚醒手機 Google Maps 導航
                const url = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;
                window.open(url, '_blank');
            };
            
            bottomSheet.classList.remove('hidden-sheet');
        }

        function hideBottomSheet() {
            bottomSheet.classList.add('hidden-sheet');
        }

        // 載入指定鄉鎮的資料到地圖
        function loadTownship(id) {
            const data = mapData[id];
            if (!data) return;

            // 1. 更新標題
            document.getElementById('header-title').innerText = `${data.name} 考核點位`;
            
            // 更新選單按鈕樣式
            document.querySelectorAll('.township-btn').forEach(btn => {
                if(btn.dataset.id === id) {
                    btn.classList.add('bg-cyan-600', 'border-cyan-400', 'text-white');
                    btn.classList.remove('bg-slate-800/50', 'border-slate-600', 'text-slate-300');
                } else {
                    btn.classList.remove('bg-cyan-600', 'border-cyan-400', 'text-white');
                    btn.classList.add('bg-slate-800/50', 'border-slate-600', 'text-slate-300');
                }
            });

            // 2. 清除舊圖層
            activeLayers.forEach(layer => map.removeLayer(layer));
            activeLayers = [];
            hideBottomSheet();

            // 3. 準備邊界計算
            const bounds = [];

            // 4. 加入公所與餐廳
            const addPOI = (poi) => {
                const marker = L.marker([poi.lat, poi.lng], { icon: icons[poi.type] }).addTo(map);
                marker.on('click', () => showBottomSheet(poi.name, `座標：${poi.lat.toFixed(4)}, ${poi.lng.toFixed(4)}`, poi.lat, poi.lng));
                
                // 加入永久顯示標籤
                const colorClass = poi.type === 'office' ? 'text-sky-400' : 'text-amber-400';
                marker.bindTooltip(`<span class="${colorClass} font-bold">${poi.name}</span>`, {
                    permanent: true,
                    direction: 'top',
                    className: 'glass-tooltip',
                    offset: [0, -20]
                });

                activeLayers.push(marker);
                bounds.push([poi.lat, poi.lng]);
            };
            addPOI(data.office);
            addPOI(data.restaurant);

            // 5. 加入路線 (起點、終點、連線)
            data.routes.forEach(route => {
                // 畫線
                const polyline = L.polyline([route.start, route.end], {
                    color: route.color,
                    weight: 4,
                    opacity: 0.8,
                    dashArray: '10, 10', // 虛線效果增加科技感
                    lineCap: 'round'
                }).addTo(map);
                
                // 起點標記
                const startMarker = L.marker(route.start, { icon: icons.start }).addTo(map);
                startMarker.on('click', () => showBottomSheet(`${route.name} (起點)`, '點擊下方按鈕開始導航至此處', route.start[0], route.start[1]));
                startMarker.bindTooltip(`<div class="text-green-400 font-bold mb-0.5">🟢 起點</div><div class="text-slate-200">${route.name}</div>`, {
                    permanent: true, direction: 'right', className: 'glass-tooltip text-center', offset: [15, 0]
                });
                
                // 終點標記
                const endMarker = L.marker(route.end, { icon: icons.end }).addTo(map);
                endMarker.on('click', () => showBottomSheet(`${route.name} (終點)`, '點擊下方按鈕開始導航至此處', route.end[0], route.end[1]));
                endMarker.bindTooltip(`<div class="text-red-400 font-bold mb-0.5">🏁 終點</div><div class="text-slate-200">${route.name}</div>`, {
                    permanent: true, direction: 'left', className: 'glass-tooltip text-center', offset: [-15, 0]
                });
                
                // 點擊路線本身
                polyline.on('click', () => showBottomSheet(route.name, `包含起點與終點，共兩處考核點`, route.start[0], route.start[1]));

                activeLayers.push(polyline, startMarker, endMarker);
                bounds.push(route.start, route.end);
            });

            // 6. 縮放視角以包含所有點位
            if (bounds.length > 0) {
                currentBounds = L.latLngBounds(bounds);
                map.fitBounds(currentBounds, { padding: [50, 50], animate: true, duration: 1 });
            }
        }

        // 初始化鄉鎮選單
        function initMenu() {
            const selector = document.getElementById('township-selector');
            Object.keys(mapData).forEach((id, index) => {
                const btn = document.createElement('button');
                btn.dataset.id = id;
                btn.className = `township-btn whitespace-nowrap px-4 py-2 rounded-full border text-sm font-medium transition-all backdrop-blur-md shadow-lg ${index === 0 ? 'bg-cyan-600 border-cyan-400 text-white' : 'bg-slate-800/50 border-slate-600 text-slate-300'}`;
                btn.innerText = mapData[id].name;
                btn.onclick = () => loadTownship(id);
                selector.appendChild(btn);
            });
        }

        // --- 啟動程序 ---
        window.onload = () => {
            initMap();
            initMenu();
            
            // 預設載入第一個鄉鎮 (草屯鎮)
            loadTownship(Object.keys(mapData)[0]);

            // 移除歡迎頁動畫
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                splash.style.visibility = 'hidden';
            }, 2000); // 2秒後淡出
        };
    </script>
</body>
