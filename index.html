<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <!-- PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="清潔考核">
    <meta name="theme-color" content="#020617">
    
    <link rel="apple-touch-icon" href="app-icon.png">
    <link rel="manifest" href="manifest.json">

    <title>南投縣清潔考核地圖系統</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap');

        html, body { 
            width: 100vw; height: 100dvh; 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: #020617; color: #f8fafc; 
            margin: 0; padding: 0; overflow: hidden; 
            overscroll-behavior: none; 
        }

        .glass { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glass-panel { background: rgba(30, 41, 59, 0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid rgba(255, 255, 255, 0.15); box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.7); }

        #splash-screen, #login-screen { transition: opacity 0.5s ease-in-out; }
        .pulse-ring { animation: pulse 2s infinite cubic-bezier(0.215, 0.61, 0.355, 1); }
        @keyframes pulse { 0% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(6, 182, 212, 0.7); } 70% { transform: scale(1.1); box-shadow: 0 0 0 20px rgba(6, 182, 212, 0); } 100% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(6, 182, 212, 0); } }

        .leaflet-control-attribution { display: none !important; }
        .leaflet-control-zoom { border: none !important; margin-top: 275px !important; }
        .leaflet-bar a { background-color: rgba(30, 41, 59, 0.8) !important; color: #06b6d4 !important; border-color: rgba(255,255,255,0.1) !important;}

        .bottom-sheet { transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); }
        .bottom-sheet.hidden-sheet { transform: translateY(100%); }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .glass-tooltip { background: rgba(15, 23, 42, 0.85) !important; backdrop-filter: blur(4px) !important; border: 1px solid rgba(255, 255, 255, 0.15) !important; color: #f8fafc !important; border-radius: 8px !important; padding: 5px 10px !important; font-size: 12px !important; font-weight: 500 !important; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5) !important; white-space: nowrap !important; }
        .hide-tooltips .glass-tooltip { opacity: 0 !important; visibility: hidden !important; transition: opacity 0.3s ease; }
        
        .user-location-marker { background-color: #3b82f6; border: 2px solid white; border-radius: 50%; width: 16px; height: 16px; box-shadow: 0 0 15px rgba(59, 130, 246, 0.8); position: relative; z-index: 1000; }
        .user-pulse { position: absolute; top: -8px; left: -8px; width: 32px; height: 32px; background-color: rgba(59, 130, 246, 0.6); border-radius: 50%; animation: user-ping 1.5s cubic-bezier(0, 0, 0.2, 1) infinite; }
        @keyframes user-ping { 75%, 100% { transform: scale(2); opacity: 0; } }

        .safe-top-padding { padding-top: max(1rem, env(safe-area-inset-top)); }
        
        path.leaflet-interactive { transition: stroke-opacity 0.6s ease, stroke-width 0.6s ease, stroke 0.6s ease, stroke-dasharray 0.6s ease; }
    </style>
</head>
<body>

    <!-- 1. 歡迎頁 -->
    <div id="splash-screen" class="fixed inset-0 z-[9999] flex flex-col items-center justify-center bg-slate-950">
        <div class="relative flex items-center justify-center w-32 h-32 mb-8">
            <div class="absolute inset-0 rounded-full border-2 border-cyan-500 pulse-ring"></div>
            <i class="ph ph-map-pin-line text-6xl text-cyan-400 drop-shadow-[0_0_15px_rgba(6,182,212,0.8)]"></i>
        </div>
        <h1 class="text-3xl font-bold tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 mb-2">清潔考核系統</h1>
        <p class="text-slate-400 tracking-widest text-sm uppercase">Smart Inspection Map System</p>
        <div class="mt-12 text-cyan-500/50 text-sm animate-pulse">系統載入中 System Loading...</div>
    </div>

    <!-- 1.5 密碼登入頁面 -->
    <div id="login-screen" class="fixed inset-0 z-[9998] flex flex-col items-center justify-center bg-slate-950/95 backdrop-blur-xl">
        <div class="glass-panel p-8 rounded-2xl flex flex-col items-center w-10/12 max-w-sm shadow-2xl border border-cyan-500/30">
            <div class="w-16 h-16 bg-cyan-500/20 rounded-full flex items-center justify-center mb-4">
                <i class="ph-fill ph-lock-key text-3xl text-cyan-400"></i>
            </div>
            <h2 class="text-xl font-bold text-white mb-2 tracking-widest">系統登入</h2>
            <p class="text-slate-400 text-sm mb-6">請輸入授權碼以存取資料</p>
            <input type="password" id="pwd-input" placeholder="請輸入密碼" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-4 py-3 text-white text-center tracking-widest focus:outline-none focus:border-cyan-400 mb-2 transition-colors">
            <p id="pwd-error" class="text-red-400 text-xs mb-4 h-4 opacity-0 transition-opacity">密碼錯誤，請重新輸入</p>
            <button id="btn-login" onclick="checkPassword()" class="w-full bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-bold py-3 px-4 rounded-xl shadow-[0_0_15px_rgba(6,182,212,0.4)] transition-all active:scale-95 tracking-widest cursor-pointer flex justify-center items-center gap-2">
                進入系統
            </button>
        </div>
    </div>

    <!-- PWA 安裝提示 -->
    <div id="pwa-prompt" class="fixed top-4 left-4 right-4 z-[9997] bg-blue-600 text-white p-4 rounded-xl shadow-2xl flex items-start gap-3 hidden transition-transform translate-y-[-150%]">
        <i class="ph-fill ph-info text-2xl"></i>
        <div class="flex-1">
            <h4 class="font-bold mb-1">將系統加入主畫面</h4>
            <p class="text-sm opacity-90 leading-tight">點擊瀏覽器下方的「分享」按鈕，選擇「加入主畫面」，即可像 App 一樣全螢幕使用！</p>
        </div>
        <button onclick="hidePwaPrompt()" class="text-white opacity-70 hover:opacity-100 cursor-pointer"><i class="ph ph-x text-lg"></i></button>
    </div>

    <!-- 2. 主畫面 (地圖容器) -->
    <div id="map" class="absolute inset-0 z-0"></div>

    <!-- 3. UI 覆蓋層 -->
    <div id="ui-layer" class="absolute inset-0 z-10 pointer-events-none">
        
        <!-- 頂部選單 -->
        <div class="pointer-events-auto absolute top-0 left-0 w-full safe-top-padding px-4 pb-3 bg-gradient-to-b from-slate-950 via-slate-950/95 to-transparent z-[50]">
            <div class="flex items-center justify-between mb-3 mt-2">
                <h2 class="text-lg font-bold flex items-center gap-2 text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-400">
                    <i class="ph-fill ph-map-pin text-cyan-400" id="header-icon"></i>
                    <span id="header-title">請選擇模式</span>
                </h2>
                <div class="flex gap-2">
                    <button class="glass w-10 h-10 rounded-full text-slate-300 hover:text-white flex justify-center items-center cursor-pointer" onclick="toggleView()" id="btn-toggle-view">
                        <i class="ph-fill ph-list text-xl"></i>
                    </button>
                    <button class="glass w-10 h-10 rounded-full text-slate-300 hover:text-white flex justify-center items-center cursor-pointer" onclick="if(currentBounds && map) map.fitBounds(currentBounds, { padding: [50, 50] })">
                        <i class="ph ph-corners-out text-xl"></i>
                    </button>
                </div>
            </div>

            <!-- 全局搜尋列 -->
            <div class="relative w-full mb-3">
                <i class="ph ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-lg"></i>
                <input type="text" id="search-input" placeholder="搜尋南投縣各路線或地點..." class="w-full bg-slate-800/80 border border-slate-700 rounded-full pl-10 pr-4 py-2 text-sm text-white focus:outline-none focus:border-cyan-400 transition-colors" oninput="handleSearch()">
                <div id="search-results" class="absolute top-full left-0 right-0 mt-1 bg-slate-800 rounded-xl shadow-2xl z-[60] hidden max-h-48 overflow-y-auto border border-slate-700"></div>
            </div>
            
            <!-- 第一層：13鄉鎮市橫向浮動按鈕 -->
            <div class="flex gap-2 overflow-x-auto no-scrollbar py-1 mb-1 w-full touch-pan-x" style="-webkit-overflow-scrolling: touch;" id="township-selector"></div>

            <!-- 第二層：6大路線日期卡片 -->
            <div class="flex gap-3 overflow-x-auto no-scrollbar py-2 mb-2 w-full touch-pan-x" style="-webkit-overflow-scrolling: touch;" id="schedule-selector"></div>

            <!-- 戰情進度儀表板 -->
            <div class="w-full px-1">
                <div class="flex justify-between text-[11px] text-slate-400 font-bold mb-1">
                    <span id="progress-text">🏆 總體達成率：0/0 點位</span>
                    <span id="progress-percent" class="text-cyan-400">0%</span>
                </div>
                <div class="w-full bg-slate-800 rounded-full h-1.5 overflow-hidden">
                    <div id="progress-bar" class="bg-gradient-to-r from-cyan-400 to-blue-500 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <!-- 4. 清單模式 (動態時間軸 List View) -->
        <div id="list-view" class="pointer-events-auto absolute inset-0 z-[45] bg-slate-950 overflow-y-auto hidden pt-[280px] pb-10 px-4" style="touch-action: pan-y;">
            <h3 id="list-main-title" class="text-lg font-bold text-cyan-400 mb-4 flex items-center gap-2 border-b border-slate-800 pb-2">
                <i class="ph-fill ph-list-bullets"></i> 任務清單
            </h3>
            <div id="list-container" class="flex flex-col gap-4">
                <!-- 動態生成清單或時間軸 -->
            </div>
        </div>

        <!-- 5. 底部資訊與面板 -->
        <div id="bottom-sheet" class="pointer-events-auto absolute bottom-0 left-0 bottom-sheet hidden-sheet glass-panel w-full rounded-t-3xl p-5 pb-8 shadow-[0_-20px_50px_rgba(0,0,0,0.8)] max-h-[55vh] overflow-y-auto flex flex-col z-[60]" style="touch-action: pan-y;">
            <div class="flex justify-between items-center mb-4">
                <div class="w-8 h-1.5"></div>
                <div class="w-12 h-1.5 bg-slate-600 rounded-full cursor-pointer" onclick="hideBottomSheet()"></div>
                <button class="w-8 h-8 flex items-center justify-center rounded-full bg-slate-800/80 text-slate-400 hover:text-white cursor-pointer" onclick="hideBottomSheet()">
                    <i class="ph-bold ph-x text-lg"></i>
                </button>
            </div>
            
            <div id="sheet-content" class="flex-1">
                <div class="flex justify-between items-start mb-2">
                    <h3 class="text-xl font-bold text-white pr-2" id="sheet-title">點位名稱</h3>
                    <button id="mark-btn" class="shrink-0 flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm font-bold transition-all border cursor-pointer" onclick="toggleItemStatus()">
                        <i class="ph-fill ph-check-circle text-lg"></i> <span id="mark-text">未考核</span>
                    </button>
                </div>
                
                <div class="text-sm text-slate-400 mb-5 w-full" id="sheet-desc">詳細資訊</div>
                
                <!-- 照片上傳區 -->
                <div class="mb-5 bg-slate-800/50 p-4 rounded-xl border border-slate-700">
                    <div class="flex justify-between items-center mb-3">
                        <h4 class="text-sm font-bold text-slate-300 flex items-center gap-2">
                            <i class="ph-fill ph-camera text-cyan-400"></i> 照片上傳區
                        </h4>
                        <label class="bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-bold py-1.5 px-3 rounded-lg flex items-center gap-1 cursor-pointer transition-colors shadow-lg">
                            <i class="ph ph-upload-simple text-base"></i> 上傳/拍攝
                            <input type="file" accept="image/*" multiple class="hidden" onchange="handlePhotoUpload(event)">
                        </label>
                    </div>
                    <div id="photo-preview-grid" class="grid grid-cols-3 gap-2 mb-3 empty:hidden"></div>
                    <button id="btn-upload-drive" onclick="uploadPhotosToDrive()" class="w-full bg-slate-700 hover:bg-slate-600 border border-slate-600 text-white text-sm font-bold py-2.5 rounded-lg flex items-center justify-center gap-2 transition-colors mt-2 cursor-pointer shadow-lg">
                        <i class="ph-fill ph-cloud-arrow-up text-lg text-fuchsia-400"></i> 一鍵同步至 Google Drive
                    </button>
                </div>

                <button id="nav-btn" class="w-full bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-bold py-3.5 px-4 rounded-xl flex items-center justify-center gap-2 shadow-lg transition-all active:scale-95 hidden cursor-pointer">
                    <i class="ph-fill ph-navigation-arrow text-xl"></i>
                    <span>開啟 Google Maps 導航</span>
                </button>
            </div>
        </div>

        <!-- 6. 地圖懸浮功能區 (智慧導航 & 定位) -->
        <div class="pointer-events-none absolute bottom-8 left-4 right-4 z-[40] flex items-end justify-between gap-3">
            
            <!-- 下一站智慧導航按鈕 -->
            <div id="smart-nav-container" class="pointer-events-auto flex-1 hidden">
                <button id="smart-nav-btn" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold py-3 px-5 rounded-full shadow-[0_10px_30px_rgba(16,185,129,0.4)] border border-emerald-400 flex items-center justify-between transition-all active:scale-95 cursor-pointer">
                    <div class="flex items-center gap-3 overflow-hidden">
                        <div class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center shrink-0">
                            <i class="ph-fill ph-navigation-arrow text-lg animate-pulse"></i>
                        </div>
                        <div class="text-left leading-tight truncate">
                            <div class="text-[10px] text-emerald-200 uppercase tracking-widest font-black">NEXT STOP</div>
                            <div class="text-sm font-bold truncate" id="smart-nav-text">下一站</div>
                        </div>
                    </div>
                    <i class="ph-bold ph-caret-right text-emerald-200 text-xl shrink-0"></i>
                </button>
            </div>

            <div class="flex-1" id="smart-nav-spacer"></div>

            <!-- 實時定位按鈕 -->
            <button id="locate-btn" class="pointer-events-auto shrink-0 glass w-14 h-14 rounded-full flex items-center justify-center text-cyan-400 hover:text-white shadow-[0_0_15px_rgba(6,182,212,0.3)] transition-all active:scale-95 cursor-pointer" onclick="locateUser()">
                <i class="ph-fill ph-crosshair text-2xl"></i>
            </button>
        </div>

    </div>

         JavaScript 詳細設定與核心邏輯 
         ========================================== -->

        // --- 狀態與變數 ---
        let inspectionState = JSON.parse(localStorage.getItem('nantou_inspection')) || {};

        let currentMode = 'schedule'; 
        let currentScheduleId = null; 
        let currentTownshipId = null;
        let currentItemId = null; 

        // 🌟 幫助函數：取得點位的經緯度 (支援 POI 與 Toilet)
        function getItemInfo(tId, itemId) {
            const d = mapData[tId];
            if (!d) return null;
            if (itemId.endsWith('_office') && d.office) return { lat: d.office.lat, lng: d.office.lng };
            if (itemId.endsWith('_restaurant') && d.restaurant) return { lat: d.restaurant.lat, lng: d.restaurant.lng };
            if (itemId.includes('_route_')) {
                const rId = parseInt(itemId.split('_route_')[1]);
                const r = d.routes.find(x => x.id === rId);
                if(r) return { lat: r.path[0][0], lng: r.path[0][1] };
            }
            if (d.pois) {
                const p = d.pois.find(x => x.id === itemId);
                if (p) return { lat: p.lat, lng: p.lng };
            }
            return null;
        }

        async function fetchSyncState() {
            try {
                const res = await fetch(GOOGLE_APP_SCRIPT_URL, {
                    method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'get_status' })
                });
                if (!res.ok) throw new Error("HTTP 狀態碼異常：" + res.status);
                const responseText = await res.text();
                let result = JSON.parse(responseText);
                if (result.status === 'success' && result.data) {
                    inspectionState = result.data;
                    localStorage.setItem('nantou_inspection', JSON.stringify(inspectionState));
                    return true;
                } else return false;
            } catch(e) { return false; }
        }

        function saveState() {
            localStorage.setItem('nantou_inspection', JSON.stringify(inspectionState));
            try { localStorage.setItem('nantou_photos_v2', JSON.stringify(inspectionPhotos)); } catch(e) { alert("手機暫存空間已滿！"); }
            updateProgressBar();
            updateSmartNav(); 
            if(!isListView) updateMarkersStatus();
            else renderListView(); 
        }

        // --- 地圖核心 ---
        let map;
        let activeLayers = [];
        let routePolylines = {}; 
        let currentBounds = null;
        let userMarker = null;
        let isListView = false;

        function createCustomIcon(iconColor, iconName, opacity=1) {
            return L.divIcon({ 
                className: 'custom-leaflet-icon', 
                html: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" style="opacity:${opacity}">
                        <circle cx="20" cy="20" r="18" fill="rgba(15, 23, 42, 0.8)" stroke="${iconColor}" stroke-width="2"/>
                        ${opacity === 1 ? `<circle cx="20" cy="20" r="24" fill="none" stroke="${iconColor}" stroke-width="1" opacity="0.4" class="pulse"/>` : ''}
                        <foreignObject x="8" y="8" width="24" height="24">
                            <div xmlns="http://www.w3.org/1999/xhtml" style="display:flex; justify-content:center; align-items:center; height:100%; color:${iconColor}; font-size:18px;"><i class="${iconName}"></i></div>
                        </foreignObject>
                       </svg>`, 
                iconSize: [40, 40], iconAnchor: [20, 20] 
            });
        }

        function getIcons(isDone) { 
            return { 
                office: createCustomIcon(isDone ? '#64748b' : '#38bdf8', 'ph-fill ph-bank', isDone ? 0.6 : 1), 
                restaurant: createCustomIcon(isDone ? '#64748b' : '#fbbf24', 'ph-fill ph-fork-knife', isDone ? 0.6 : 1), 
                start: createCustomIcon(isDone ? '#64748b' : '#4ade80', 'ph-fill ph-flag-pennant', isDone ? 0.6 : 1), 
                end: createCustomIcon(isDone ? '#64748b' : '#f87171', 'ph-fill ph-flag-checkered', isDone ? 0.6 : 1),
                poi: createCustomIcon(isDone ? '#64748b' : '#a78bfa', 'ph-fill ph-buildings', isDone ? 0.6 : 1),
                // ✨ 新增公廁圖示（綠色）
                toilet: createCustomIcon(isDone ? '#64748b' : '#34d399', 'ph-fill ph-toilet', isDone ? 0.6 : 1)
            }; 
        }

        function initMap() {
            map = L.map('map', { zoomControl: false, tap: false }).setView([23.903, 120.951], 10);
            L.control.zoom({ position: 'topright' }).addTo(map);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { 
                attribution: '&copy; OpenStreetMap', subdomains: 'abcd', maxZoom: 20 
            }).addTo(map);
            
            map.on('click', function() {
                const bs = document.getElementById('bottom-sheet');
                if(bs && !bs.classList.contains('hidden-sheet')) hideBottomSheet();
            });

            map.on('zoomend', function() { 
                const mapEl = document.getElementById('map');
                if (mapEl) {
                    if(map.getZoom() < 12) mapEl.classList.add('hide-tooltips');
                    else mapEl.classList.remove('hide-tooltips');
                }
            });
        }

        function updateMarkersStatus() {
            if (currentMode === 'schedule' && currentScheduleId) loadSchedule(currentScheduleId, true);
            else if (currentMode === 'township' && currentTownshipId) loadTownship(currentTownshipId, true);
        }

        function highlightRoute(itemId) {
            Object.keys(routePolylines).forEach(key => {
                const isDone = inspectionState[key];
                const originalColor = routePolylines[key].options.originalColor;
                routePolylines[key].setStyle({ color: isDone ? '#475569' : originalColor, weight: 4, opacity: 0.25, dashArray: '10, 10' });
            });

            if (routePolylines[itemId]) {
                const isDone = inspectionState[itemId];
                const originalColor = routePolylines[itemId].options.originalColor;
                routePolylines[itemId].setStyle({ color: isDone ? '#94a3b8' : originalColor, weight: 8, opacity: 1, dashArray: '15, 15' });
                routePolylines[itemId].bringToFront(); 
                
                map.flyToBounds(routePolylines[itemId].getBounds(), {
                    paddingTopLeft: [30, 280], paddingBottomRight: [30, window.innerHeight * 0.45], 
                    maxZoom: 16, animate: true, duration: 1.2
                });
            }
        }

        function resetRouteHighlights() {
            Object.keys(routePolylines).forEach(k => {
                const originalColor = routePolylines[k].options.originalColor;
                const isDone = inspectionState[k];
                routePolylines[k].setStyle({ weight: 5, color: isDone ? '#475569' : originalColor, opacity: isDone ? 0.6 : 0.9, dashArray: '10, 10' });
            });
            if (currentBounds) map.flyToBounds(currentBounds, { padding: [50, 50], animate: true, duration: 1.2 });
        }

        function drawMapForTownships(townshipsArray) {
            const bounds = [];
            townshipsArray.forEach(tId => {
                const data = mapData[tId];
                if(!data) return;

                const drawPOI = (poi, itemId, type) => {
                    const isDone = inspectionState[itemId];
                    let icon;
                    if (type === 'office') icon = getIcons(isDone).office;
                    else if (type === 'restaurant') icon = getIcons(isDone).restaurant;
                    else if (type === 'toilet') icon = getIcons(isDone).toilet;
                    else icon = getIcons(isDone).poi;

                    const marker = L.marker([poi.lat, poi.lng], { icon: icon }).addTo(map);
                    
                    marker.on('click', (e) => {
                        L.DomEvent.stopPropagation(e);
                        resetRouteHighlights();
                        map.flyTo([poi.lat, poi.lng], 16, { animate: true, duration: 1.2 });
                        showBottomSheet(poi.name, `<span class="bg-slate-700 px-2 py-0.5 rounded text-xs mr-2">${data.name}</span>類型：${type === 'office' ? '鄉鎮公所' : type === 'restaurant' ? '聚餐餐廳' : type === 'toilet' ? '公廁' : '一般考核點'}`, poi.lat, poi.lng, itemId);
                    });
                    
                    const colorClass = isDone ? 'text-slate-400' : (type === 'office' ? 'text-sky-400' : type === 'restaurant' ? 'text-amber-400' : type === 'toilet' ? 'text-emerald-400' : 'text-purple-400');
                    marker.bindTooltip(`<span class="${colorClass} font-bold">${poi.name}${isDone ? ' (已完勘)' : ''}</span>`, { permanent: true, direction: 'top', className: 'glass-tooltip', offset: [0, -20] });
                    activeLayers.push(marker); bounds.push([poi.lat, poi.lng]);
                };

                if (data.office) drawPOI(data.office, `${tId}_office`, 'office'); 
                if (data.restaurant) drawPOI(data.restaurant, `${tId}_restaurant`, 'restaurant');

                data.routes.forEach(route => {
                    const itemId = `${tId}_route_${route.id}`;
                    const isDone = inspectionState[itemId];
                    const routeColor = isDone ? '#475569' : route.color;
                    const startPt = route.path[0];
                    const endPt = route.path[route.path.length - 1];

                    const polyline = L.polyline(route.path, { color: routeColor, weight: 5, opacity: isDone ? 0.6 : 0.9, dashArray: '10, 10', lineCap: 'round', lineJoin: 'round', originalColor: route.color }).addTo(map);
                    routePolylines[itemId] = polyline; 

                    const startMarker = L.marker(startPt, { icon: getIcons(isDone).start }).addTo(map);
                    const endMarker = L.marker(endPt, { icon: getIcons(isDone).end }).addTo(map);

                    const openSheet = (e) => {
                        L.DomEvent.stopPropagation(e);
                        highlightRoute(itemId); 
                        const descHTML = `
                            <div class="mb-3"><span class="bg-slate-700 px-2 py-0.5 rounded text-xs text-white shadow-md">${data.name}</span></div>
                            <div class="flex flex-col gap-2 mb-3">
                                <div class="bg-slate-800/90 p-3 rounded-xl border border-emerald-500/30 flex items-center justify-between shadow-lg relative overflow-hidden">
                                    <div class="absolute -right-4 -top-4 w-16 h-16 bg-emerald-500/10 rounded-full"></div>
                                    <div class="flex items-center gap-3 relative z-10"><div class="w-10 h-10 rounded-full bg-emerald-500/20 flex items-center justify-center text-emerald-400 shrink-0"><i class="ph-fill ph-flag-pennant text-xl"></i></div>
                                        <div><div class="font-bold text-white text-sm tracking-wide">起點：${route.name}起點</div><div class="text-[11px] text-slate-400 font-mono mt-0.5">${startPt[0].toFixed(5)}, ${startPt[1].toFixed(5)}</div></div>
                                    </div>
                                    <button onclick="window.open('https://www.google.com/maps/dir/?api=1&destination=${startPt[0]},${startPt[1]}', '_blank')" class="bg-emerald-600 hover:bg-emerald-500 text-white w-10 h-10 rounded-full flex items-center justify-center shadow-lg active:scale-95 relative z-10 shrink-0 cursor-pointer"><i class="ph-bold ph-navigation-arrow text-lg"></i></button>
                                </div>
                                <div class="w-1 h-3 bg-gradient-to-b from-emerald-500/50 to-rose-500/50 mx-auto rounded-full"></div>
                                <div class="bg-slate-800/90 p-3 rounded-xl border border-rose-500/30 flex items-center justify-between shadow-lg relative overflow-hidden">
                                    <div class="absolute -right-4 -top-4 w-16 h-16 bg-rose-500/10 rounded-full"></div>
                                    <div class="flex items-center gap-3 relative z-10"><div class="w-10 h-10 rounded-full bg-rose-500/20 flex items-center justify-center text-rose-400 shrink-0"><i class="ph-fill ph-flag-checkered text-xl"></i></div>
                                        <div><div class="font-bold text-white text-sm tracking-wide">終點：${route.name}終點</div><div class="text-[11px] text-slate-400 font-mono mt-0.5">${endPt[0].toFixed(5)}, ${endPt[1].toFixed(5)}</div></div>
                                    </div>
                                    <button onclick="window.open('https://www.google.com/maps/dir/?api=1&destination=${endPt[0]},${endPt[1]}', '_blank')" class="bg-rose-600 hover:bg-rose-500 text-white w-10 h-10 rounded-full flex items-center justify-center shadow-lg active:scale-95 relative z-10 shrink-0 cursor-pointer"><i class="ph-bold ph-navigation-arrow text-lg"></i></button>
                                </div>
                            </div>
                        `;
                        showBottomSheet(route.name, descHTML, 0, 0, itemId, true);
                    };
                    
                    polyline.on('click', openSheet); startMarker.on('click', openSheet); endMarker.on('click', openSheet);
                    startMarker.bindTooltip(`<div class="${isDone ? 'text-slate-400' : 'text-green-400'} font-bold mb-0.5">🟢 起點</div><div class="text-slate-200">${route.name}</div>`, { permanent: true, direction: 'right', className: 'glass-tooltip text-center', offset: [15, 0] });
                    endMarker.bindTooltip(`<div class="${isDone ? 'text-slate-400' : 'text-red-400'} font-bold mb-0.5">🏁 終點</div><div class="text-slate-200">${route.name}</div>`, { permanent: true, direction: 'left', className: 'glass-tooltip text-center', offset: [-15, 0] });

                    activeLayers.push(polyline, startMarker, endMarker); route.path.forEach(pt => bounds.push(pt));
                });

                // ✨ 繪製 POI 與 Toilet
                if (data.pois) {
                    data.pois.forEach(poi => {
                        const itemId = poi.id;
                        const isDone = inspectionState[itemId];
                        let icon = getIcons(isDone).poi;
                        let typeLabel = '一般考核點';
                        let colorClass = 'text-purple-400';
                        if (poi.type === 'toilet') {
                            icon = getIcons(isDone).toilet;
                            typeLabel = '公廁';
                            colorClass = 'text-emerald-400';
                        }
                        const marker = L.marker([poi.lat, poi.lng], { icon: icon }).addTo(map);
                        
                        marker.on('click', (e) => {
                            L.DomEvent.stopPropagation(e);
                            resetRouteHighlights();
                            map.flyTo([poi.lat, poi.lng], 16, { animate: true, duration: 1.2 });
                            showBottomSheet(poi.name, `<span class="bg-slate-700 px-2 py-0.5 rounded text-xs mr-2">${data.name}</span>類型：${typeLabel}`, poi.lat, poi.lng, itemId);
                        });
                        
                        const finalColorClass = isDone ? 'text-slate-400' : colorClass;
                        marker.bindTooltip(`<span class="${finalColorClass} font-bold">${poi.name}${isDone ? ' (已完勘)' : ''}</span>`, { permanent: true, direction: 'top', className: 'glass-tooltip', offset: [0, -20] });
                        activeLayers.push(marker);
                        bounds.push([poi.lat, poi.lng]);
                    });
                }
            });
            return bounds;
        }

        function loadSchedule(scheduleId, keepHighlight = false) {
            currentMode = 'schedule';
            currentScheduleId = scheduleId;
            const schedule = scheduleData.find(s => s.id === scheduleId);
            if (!schedule) return;

            const headerTitle = document.getElementById('header-title');
            if(headerTitle) headerTitle.innerText = `${schedule.date} 任務`;
            
            const headerIcon = document.getElementById('header-icon');
            if(headerIcon) headerIcon.className = "ph-fill ph-calendar-check text-cyan-400";
            
            const listTitle = document.getElementById('list-main-title');
            if(listTitle) listTitle.innerHTML = `<i class="ph-fill ph-calendar-check"></i> ${schedule.date} ${schedule.routeName}`;
            
            document.querySelectorAll('.schedule-btn').forEach(btn => {
                const sId = btn.dataset.id;
                const s = scheduleData.find(x => x.id === sId);
                if (!s) return;
                if(sId === scheduleId) {
                    btn.className = 'schedule-btn shrink-0 min-w-[120px] flex flex-col items-center justify-center rounded-xl p-2 transition-all cursor-pointer border bg-cyan-900/40 border-cyan-400 shadow-[0_0_15px_rgba(6,182,212,0.5)]';
                    btn.innerHTML = `<span class="text-white font-bold text-sm tracking-wide drop-shadow-md">${s.date}</span><span class="text-cyan-300 text-xs font-medium mt-0.5">${s.routeName}</span>`;
                } else {

                    btn.innerHTML = `<span class="text-slate-300 font-bold text-sm tracking-wide">${s.date}</span><span class="text-slate-500 text-xs font-medium mt-0.5">${s.routeName}</span>`;

        // 🌟 進度儀表板
        function updateProgressBar() {
            let total = 0; let comp = 0; let titleText = "";

            if (currentMode === 'schedule' && currentScheduleId) {
                const schedule = scheduleData.find(s => s.id === currentScheduleId);
                titleText = `🏆 ${schedule.date.split(' ')[0]} 達成率：`;
                if(schedule.timeline) {
                    const actionableItems = schedule.timeline.filter(i => i.itemId);
                    total = actionableItems.length;
                    comp = actionableItems.filter(i => inspectionState[i.itemId]).length;
                }
            } else if (currentMode === 'township' && currentTownshipId) {
                const data = mapData[currentTownshipId];
                titleText = `📍 ${data.name} 達成率：`;
                if (data.office) { total++; if(inspectionState[`${currentTownshipId}_office`]) comp++; }
                if (data.restaurant) { total++; if(inspectionState[`${currentTownshipId}_restaurant`]) comp++; }
                data.routes.forEach(r => { total++; if(inspectionState[`${currentTownshipId}_route_${r.id}`]) comp++; });
                if (data.pois) {
                    data.pois.forEach(p => { total++; if(inspectionState[p.id]) comp++; });
                }
            } else { return; }
            
            const pct = total === 0 ? 0 : Math.round((comp / total) * 100);
            
            const progressText = document.getElementById('progress-text');
            if(progressText) progressText.innerText = `${titleText}${comp} / ${total}`;
            
            const progressPercent = document.getElementById('progress-percent');
            if(progressPercent) progressPercent.innerText = `${pct}%`;
            
            const progressBar = document.getElementById('progress-bar');
            if(progressBar) progressBar.style.width = `${pct}%`;
        }

        // 🌟 智慧導航
        function updateSmartNav() {
            const navContainer = document.getElementById('smart-nav-container');
            const navSpacer = document.getElementById('smart-nav-spacer');
            if (!navContainer || !navSpacer) return;
            
            if (currentMode !== 'schedule' || !currentScheduleId) {
                navContainer.classList.add('hidden');
                navSpacer.classList.remove('hidden');
                return;
            }
            
            const schedule = scheduleData.find(s => s.id === currentScheduleId);
            if (!schedule || !schedule.timeline) return;
            
            const nextItem = schedule.timeline.find(item => item.itemId && !inspectionState[item.itemId]);
            
            if (nextItem) {
                document.getElementById('smart-nav-text').innerText = nextItem.label;
                const info = getItemInfo(nextItem.tId, nextItem.itemId);
                
                const btn = document.getElementById('smart-nav-btn');
                if (btn) {
                    btn.onclick = () => {
                        if (info) jumpToMap(nextItem.tId, nextItem.itemId, info.lat, info.lng, nextItem.label);
                    };
                }
                navSpacer.classList.add('hidden');
                navContainer.classList.remove('hidden');
            } else {
                navContainer.classList.add('hidden');
                navSpacer.classList.remove('hidden');
            }
        }

        async function toggleItemStatus() {
            if(!currentItemId) return;
            const newState = !inspectionState[currentItemId];
            const btn = document.getElementById('mark-btn');
            const markText = document.getElementById('mark-text');

            if(btn) { btn.className = "shrink-0 flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm font-bold transition-all bg-amber-500/20 border-amber-500 text-amber-400 cursor-wait"; btn.disabled = true; }
            if(markText) markText.innerHTML = '<i class="ph ph-spinner animate-spin"></i> 同步中...';

            try {
                const response = await fetch(GOOGLE_APP_SCRIPT_URL, {
                    method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'set_status', itemId: currentItemId, isDone: newState })
                });
                
                if (!response.ok) throw new Error("HTTP 狀態碼異常：" + response.status);
                const responseText = await response.text();
                let result;
                try { result = JSON.parse(responseText); } catch(e) { throw new Error("雲端回傳非預期格式"); }

                if (result.status === 'success') {
                    inspectionState[currentItemId] = newState;
                    saveState(); 
                    if (newState) {
                        if(btn) btn.className = "shrink-0 flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm font-bold transition-all bg-emerald-500/20 border-emerald-500 text-emerald-400 cursor-pointer";
                        if(markText) markText.innerText = "已考核";
                    } else {
                        if(btn) btn.className = "shrink-0 flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm font-bold transition-all bg-slate-800 border-slate-600 text-slate-300 cursor-pointer";
                        if(markText) markText.innerText = "未考核";
                    }
                } else { throw new Error(result.message); }
            } catch(e) {
                alert("⚠️ 雲端同步失敗！請確認網路及 GAS 權限。\n詳細：" + e.message);
                const isDone = inspectionState[currentItemId];
                if (isDone) {
                    if(btn) btn.className = "shrink-0 flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm font-bold transition-all bg-emerald-500/20 border-emerald-500 text-emerald-400 cursor-pointer";
                    if(markText) markText.innerText = "已考核";
                } else {
                    if(btn) btn.className = "shrink-0 flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm font-bold transition-all bg-slate-800 border-slate-600 text-slate-300 cursor-pointer";
                    if(markText) markText.innerText = "未考核";
                }
            } finally { if(btn) btn.disabled = false; }
        }

        function handlePhotoUpload(event) {
            const files = event.target.files;
            if(!files.length || !currentItemId) return;

            if (!inspectionPhotos[currentItemId]) inspectionPhotos[currentItemId] = [];
            const grid = document.getElementById('photo-preview-grid');
            if(grid) grid.innerHTML += `<div class="col-span-3 text-center text-emerald-400 text-sm py-2 font-bold animate-pulse" id="loading-txt"><i class="ph ph-spinner animate-spin"></i> 照片已準備上傳...</div>`;

            let processed = 0;
            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        let w = img.width, h = img.height;
                        if (w > 800) { h *= 800 / w; w = 800; }
                        canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        inspectionPhotos[currentItemId].push({ id: Date.now() + Math.random(), data: canvas.toDataURL('image/jpeg', 0.6), uploaded: false });
                        processed++;
                        if(processed === files.length) { saveState(); renderPhotos(); }
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
            event.target.value = '';
        }

        function renderPhotos() {
            const grid = document.getElementById('photo-preview-grid');
            if(!grid) return;
            const photos = inspectionPhotos[currentItemId] || [];
            grid.innerHTML = ''; let hasPending = false;

            photos.forEach((photo) => {
                if(!photo.uploaded) hasPending = true;
                const imgContent = photo.data ? `<img src="${photo.data}" class="w-full h-full object-cover">` : `<i class="ph-fill ph-image text-4xl text-slate-600"></i>`;
                grid.innerHTML += `
                    <div class="relative w-full aspect-square rounded-lg border border-slate-600 overflow-hidden group bg-slate-800 flex items-center justify-center">
                        ${imgContent}
                        ${photo.uploaded 
                            ? `<div class="absolute inset-0 bg-black/60 flex flex-col items-center justify-center gap-1"><i class="ph-fill ph-check-circle text-emerald-400 text-3xl drop-shadow-md"></i><span class="text-[10px] font-bold text-emerald-400">已存雲端</span></div>` 
                            : `<button onclick="deletePhoto('${photo.id}')" class="absolute top-1 right-1 bg-red-500/80 text-white w-6 h-6 rounded-full flex items-center justify-center backdrop-blur cursor-pointer"><i class="ph-bold ph-x text-xs"></i></button>`
                        }
                    </div>
                `;
            });
            if(hasPending) grid.innerHTML += `<div class="col-span-3 text-center text-emerald-400 text-sm py-1 mt-1 font-bold animate-pulse"><i class="ph-fill ph-check-circle"></i> 照片已暫存，請點擊下方按鈕同步</div>`;
        }

        function deletePhoto(photoId) {
            if(!confirm("確定要刪除這張尚未上傳的照片嗎？")) return;
            inspectionPhotos[currentItemId] = inspectionPhotos[currentItemId].filter(p => p.id !== photoId);
            saveState(); renderPhotos();
        }

        async function uploadPhotosToDrive() {
            const photos = inspectionPhotos[currentItemId] || [];
            const pendingPhotos = photos.filter(p => !p.uploaded);
            
            if (pendingPhotos.length === 0) return alert("目前沒有需要上傳的新照片！");
            
            const btn = document.getElementById('btn-upload-drive');
            if (btn) { btn.innerHTML = '<i class="ph ph-spinner animate-spin text-lg"></i> 上傳中...'; btn.disabled = true; btn.classList.add('opacity-50'); }

            const currentTid = currentItemId.split('_')[0]; 
            const townshipName = mapData[currentTid].name;
            const pointName = document.getElementById('sheet-title').innerText.replace('考核點位', '').trim();
            let successCount = 0;

            for (let i = 0; i < photos.length; i++) {
                if (photos[i].uploaded) continue;
                const base64Data = photos[i].data.split(',')[1];
                const fileName = `${townshipName}_${pointName}_${Date.now()}.jpg`;

                try {
                    const response = await fetch(GOOGLE_APP_SCRIPT_URL, {
                        method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: 'upload_photo', township: townshipName, pointName: pointName, filename: fileName, mimeType: "image/jpeg", base64: base64Data })
                    });
                    const result = await response.json();
                    if (result.status === "success") { photos[i].uploaded = true; photos[i].data = ""; successCount++; }
                } catch (err) { console.error("上傳失敗", err); }
            }

            saveState(); renderPhotos();
            if (btn) { btn.disabled = false; btn.classList.remove('opacity-50'); btn.innerHTML = '<i class="ph-fill ph-cloud-arrow-up text-lg text-fuchsia-400"></i> 一鍵同步至 Google Drive'; }
            if(successCount === pendingPhotos.length) alert("✅ 照片已成功上傳至雲端硬碟！");
            else alert(`⚠️ 上傳完畢。成功: ${successCount} 張，失敗: ${pendingPhotos.length - successCount} 張。`);
        }

        function showBottomSheet(title, desc, lat, lng, itemId, isRoute = false) {
            currentItemId = itemId;
            
            const sheetTitle = document.getElementById('sheet-title');
            if(sheetTitle) sheetTitle.innerText = title;
            
            const sheetDesc = document.getElementById('sheet-desc');
            if(sheetDesc) sheetDesc.innerHTML = desc;
            
            const isDone = inspectionState[itemId];
            const btn = document.getElementById('mark-btn');
            const markText = document.getElementById('mark-text');
            
            if (isDone) {
                if(btn) btn.className = "shrink-0 flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm font-bold transition-all bg-emerald-500/20 border-emerald-500 text-emerald-400 cursor-pointer";
                if(markText) markText.innerText = "已考核";

                if(btn) btn.className = "shrink-0 flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm font-bold transition-all bg-slate-800 border-slate-600 text-slate-300 cursor-pointer";
                if(markText) markText.innerText = "未考核";
            }

            renderPhotos();
            
            const navBtn = document.getElementById('nav-btn');
            if (navBtn) {
                if (isRoute) { 
                    navBtn.classList.add('hidden'); 
                } else { 
                    navBtn.classList.remove('hidden'); 
                    const tId = itemId.split('_')[0];
                    const townshipName = mapData[tId] ? mapData[tId].name : '';

                    const destinationQuery = encodeURIComponent(`${townshipName} ${cleanTitle}`);

        function hideBottomSheet() {

            bs.classList.add('hidden-sheet'); currentItemId = null; resetRouteHighlights();

        function hidePwaPrompt() {

            if(pwa) pwa.classList.add('hidden'); 
        }

        function toggleView() {
            isListView = !isListView;
            const listEl = document.getElementById('list-view');
            const btnIcon = document.querySelector('#btn-toggle-view i');
            hideBottomSheet();

            if (listEl && btnIcon) {

        // 🌟 升級版清單模式 (動態時間軸，含 POI 與 午餐留白)
        function renderListView(filterText = "") {
            const container = document.getElementById('list-container');
            if(!container) return;
            container.innerHTML = '';
            
            if (currentMode === 'schedule' && currentScheduleId && !filterText) {
                const schedule = scheduleData.find(s => s.id === currentScheduleId);
                if(!schedule || !schedule.timeline) return;
                
                let timelineHTML = `<div class="relative border-l-2 border-slate-700 ml-4 pl-6 py-2 flex flex-col gap-6">`;
                
                schedule.timeline.forEach((item) => {
                    if (item.type === 'start' || item.type === 'end' || item.type === 'lunch') {
                        let dotColor = 'bg-slate-600';
                        let textColor = 'text-slate-400';
                        if (item.type === 'lunch') {
                            dotColor = 'bg-amber-500';
                            textColor = 'text-amber-400';
                        }
                        timelineHTML += `
                            <div class="relative">
                                <div class="absolute -left-[31px] top-1.5 w-4 h-4 ${dotColor} rounded-full ring-4 ring-slate-950"></div>
                                <div class="text-sm font-bold text-slate-500 mb-0.5">${item.time}</div>
                                <div class="text-slate-400 font-bold ${textColor}">${item.label}</div>
                            </div>
                        `;
                    } else {
                        const isDone = inspectionState[item.itemId];
                        const hasPhoto = (inspectionPhotos[item.itemId] && inspectionPhotos[item.itemId].length > 0);
                        const isRestaurant = item.itemId.includes('restaurant');
                        
                        const dotColor = isDone ? 'bg-emerald-500' : (isRestaurant ? 'bg-amber-500' : 'bg-cyan-500');
                        const borderColor = isDone ? 'border-emerald-500/50' : 'border-slate-700';
                        
                        const info = getItemInfo(item.tId, item.itemId);
                        const lat = info ? info.lat : 0;
                        const lng = info ? info.lng : 0;
                        
                        timelineHTML += `
                            <div class="relative">
                                <div class="absolute -left-[31px] top-4 w-4 h-4 ${dotColor} rounded-full ring-4 ring-slate-950 shadow-[0_0_10px_currentColor]"></div>
                                <div class="text-sm font-bold text-cyan-400 mb-1.5">${item.time}</div>
                                
                                <div class="bg-slate-800/80 border ${borderColor} p-3 rounded-xl shadow-lg flex items-center justify-between cursor-pointer active:scale-95 transition-transform" onclick="jumpToMap('${item.tId}', '${item.itemId}', ${lat}, ${lng}, '${item.label}')">
                                    <div class="flex-1 pr-2">
                                        <div class="text-[11px] text-slate-400 mb-1 flex gap-2 flex-wrap">
                                            <span class="bg-slate-900 px-2 py-0.5 rounded text-cyan-300 border border-slate-700">${mapData[item.tId].name}</span>
                                            ${isDone ? '<span class="text-emerald-400 flex items-center gap-1"><i class="ph-fill ph-check-circle"></i> 已完勘</span>' : ''}
                                            ${hasPhoto ? '<span class="text-amber-400 flex items-center gap-1"><i class="ph-fill ph-camera"></i> 照片</span>' : ''}
                                        </div>
                                        <h4 class="text-white font-bold text-base leading-tight">${item.label}</h4>
                                    </div>
                                    <div class="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center text-cyan-400 shrink-0 shadow-inner"><i class="ph-bold ph-caret-right text-lg"></i></div>
                                </div>
                            </div>
                        `;
                    }
                });
                timelineHTML += `</div>`;
                container.innerHTML = timelineHTML;
                return;
            }

            let targetTownships = [];
            if (filterText) {
                targetTownships = Object.keys(mapData);
            } else if (currentMode === 'township' && currentTownshipId) {
                targetTownships = [currentTownshipId];
            }

            if (targetTownships.length === 0) return;
            let hasAnyResult = false;

            targetTownships.forEach(tId => {
                const d = mapData[tId];
                if (!d) return;

                let itemsHTML = ''; 
                let tComp = 0; 
                let tTotal = (d.office ? 1 : 0) + (d.restaurant ? 1 : 0) + d.routes.length + (d.pois ? d.pois.length : 0);
                
                const checkAndRender = (title, type, lat, lng, itemId) => {
                    const isDone = inspectionState[itemId];
                    if(isDone) tComp++; 
                    if (filterText && !title.includes(filterText) && !d.name.includes(filterText)) return;
                    hasAnyResult = true;
                    
                    const hasPhoto = (inspectionPhotos[itemId] && inspectionPhotos[itemId].length > 0);
                    itemsHTML += `
                        <div class="bg-slate-900 border ${isDone ? 'border-emerald-500/30' : 'border-slate-700'} p-4 rounded-xl shadow-lg flex items-center justify-between cursor-pointer active:scale-95 transition-transform" onclick="jumpToMap('${tId}', '${itemId}', ${lat}, ${lng}, '${title}')">
                            <div>
                                <div class="text-xs text-slate-400 mb-1 flex gap-2">
                                    <span class="bg-slate-800 px-2 py-0.5 rounded text-cyan-400">${d.name}</span>
                                    ${isDone ? '<span class="text-emerald-400"><i class="ph-fill ph-check-circle"></i> 已完勘</span>' : ''}
                                    ${hasPhoto ? '<span class="text-amber-400"><i class="ph-fill ph-camera"></i> 照片</span>' : ''}
                                </div>
                                <h4 class="text-white font-bold text-lg">${title}</h4>
                            </div>
                            <div class="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center text-cyan-400"><i class="ph-fill ph-navigation-arrow text-lg"></i></div>
                        </div>`;
                };

                if (d.office) checkAndRender(d.office.name, 'office', d.office.lat, d.office.lng, `${tId}_office`);
                d.routes.forEach(r => checkAndRender(r.name, 'route', r.path[0][0], r.path[0][1], `${tId}_route_${r.id}`));
                if (d.restaurant) checkAndRender(d.restaurant.name, 'restaurant', d.restaurant.lat, d.restaurant.lng, `${tId}_restaurant`);
                // ✨ 清單模式顯示 POI 與 Toilet
                if (d.pois) {
                    d.pois.forEach(poi => checkAndRender(poi.name, poi.type || 'poi', poi.lat, poi.lng, poi.id));
                }

                if (itemsHTML !== '') {
                    container.innerHTML += `
                        <div class="mt-4 mb-2">
                            <h4 class="text-white font-bold text-base flex items-center gap-2 bg-slate-800/80 px-3 py-2 rounded-lg border border-slate-700">
                                <i class="ph-fill ph-map-pin text-rose-400"></i> ${d.name} 
                                <span class="text-xs text-slate-400 font-normal ml-auto">進度 ${tComp}/${tTotal}</span>
                            </h4>
                        </div>
                        <div class="flex flex-col gap-3 pl-2 border-l-2 border-slate-800 ml-3">${itemsHTML}</div>
                    `;
                }
            });
            if(!hasAnyResult) container.innerHTML = '<p class="text-slate-500 text-center py-10">找不到符合的地點或路線</p>';
        }

        function jumpToMap(tId, itemId, lat, lng, title) {
            if (isListView) toggleView();
            const searchResults = document.getElementById('search-results');
            if(searchResults) searchResults.classList.add('hidden');
            
            const searchInput = document.getElementById('search-input');
            if(searchInput) searchInput.value = '';

            if (currentMode === 'schedule') {
                const schedule = scheduleData.find(s => s.id === currentScheduleId);
                if (!schedule.townships.includes(tId)) loadTownship(tId, true);
            } else {
                if (currentTownshipId !== tId) loadTownship(tId, true);
            }
            
            if (itemId.includes('_route_')) {
                const routeId = parseInt(itemId.split('_route_')[1]);
                const route = mapData[tId].routes.find(r => r.id === routeId);
                const startPt = route.path[0];
                const endPt = route.path[route.path.length-1];
                const data = mapData[tId];
                
                const descHTML = `
                    <div class="mb-3"><span class="bg-slate-700 px-2 py-0.5 rounded text-xs text-white shadow-md">${data.name}</span></div>
                    <div class="flex flex-col gap-2 mb-3">
                        <div class="bg-slate-800/90 p-3 rounded-xl border border-emerald-500/30 flex items-center justify-between shadow-lg relative overflow-hidden">
                            <div class="absolute -right-4 -top-4 w-16 h-16 bg-emerald-500/10 rounded-full"></div>
                            <div class="flex items-center gap-3 relative z-10"><div class="w-10 h-10 rounded-full bg-emerald-500/20 flex items-center justify-center text-emerald-400 shrink-0"><i class="ph-fill ph-flag-pennant text-xl"></i></div>
                                <div><div class="font-bold text-white text-sm tracking-wide">起點：${route.name}起點</div><div class="text-[11px] text-slate-400 font-mono mt-0.5">${startPt[0].toFixed(5)}, ${startPt[1].toFixed(5)}</div></div>
                            </div>
                            <button onclick="window.open('https://www.google.com/maps/dir/?api=1&destination=${startPt[0]},${startPt[1]}', '_blank')" class="bg-emerald-600 hover:bg-emerald-500 text-white w-10 h-10 rounded-full flex items-center justify-center shadow-lg active:scale-95 relative z-10 shrink-0 cursor-pointer"><i class="ph-bold ph-navigation-arrow text-lg"></i></button>
                        </div>
                        <div class="w-1 h-3 bg-gradient-to-b from-emerald-500/50 to-rose-500/50 mx-auto rounded-full"></div>
                        <div class="bg-slate-800/90 p-3 rounded-xl border border-rose-500/30 flex items-center justify-between shadow-lg relative overflow-hidden">
                            <div class="absolute -right-4 -top-4 w-16 h-16 bg-rose-500/10 rounded-full"></div>
                            <div class="flex items-center gap-3 relative z-10"><div class="w-10 h-10 rounded-full bg-rose-500/20 flex items-center justify-center text-rose-400 shrink-0"><i class="ph-fill ph-flag-checkered text-xl"></i></div>
                                <div><div class="font-bold text-white text-sm tracking-wide">終點：${route.name}終點</div><div class="text-[11px] text-slate-400 font-mono mt-0.5">${endPt[0].toFixed(5)}, ${endPt[1].toFixed(5)}</div></div>
                            </div>
                            <button onclick="window.open('https://www.google.com/maps/dir/?api=1&destination=${endPt[0]},${endPt[1]}', '_blank')" class="bg-rose-600 hover:bg-rose-500 text-white w-10 h-10 rounded-full flex items-center justify-center shadow-lg active:scale-95 relative z-10 shrink-0 cursor-pointer"><i class="ph-bold ph-navigation-arrow text-lg"></i></button>
                        </div>
                    </div>`;
                highlightRoute(itemId);
                showBottomSheet(title, descHTML, 0, 0, itemId, true);
            } else {
                resetRouteHighlights();
                map.flyTo([lat, lng], 16, { animate: true, duration: 1.2 });
                setTimeout(() => { showBottomSheet(title, `<span class="bg-slate-700 px-2 py-0.5 rounded text-xs mr-2">${mapData[tId].name}</span>類型：${itemId.includes('office') ? '鄉鎮公所' : itemId.includes('restaurant') ? '聚餐餐廳' : '一般考核點'}`, lat, lng, itemId); }, 1000);
            }
        }

        function handleSearch() {
            const input = document.getElementById('search-input').value.trim();
            const resultBox = document.getElementById('search-results');
            if(!resultBox) return;

            if (input.length === 0) {
                resultBox.classList.add('hidden');
                if (isListView) renderListView(); return;
            }

            if (isListView) { renderListView(input); } 
            else {
                resultBox.innerHTML = '';
                let count = 0;
                Object.keys(mapData).forEach(tId => {
                    const d = mapData[tId];
                    const checkAdd = (name, lat, lng, itemId) => {
                        if (name.includes(input) || d.name.includes(input)) {
                            count++;
                            resultBox.innerHTML += `<div class="px-4 py-3 hover:bg-slate-700 cursor-pointer border-b border-slate-700 last:border-0" onclick="jumpToMap('${tId}', '${itemId}', ${lat}, ${lng}, '${name}')"><div class="text-xs text-cyan-400 mb-0.5">${d.name}</div><div class="text-white font-medium">${name}</div></div>`;
                        }
                    };
                    if (d.office) checkAdd(d.office.name, d.office.lat, d.office.lng, `${tId}_office`);
                    d.routes.forEach(r => checkAdd(r.name, r.path[0][0], r.path[0][1], `${tId}_route_${r.id}`));
                    if (d.restaurant) checkAdd(d.restaurant.name, d.restaurant.lat, d.restaurant.lng, `${tId}_restaurant`);
                    if (d.pois) {
                        d.pois.forEach(p => checkAdd(p.name, p.lat, p.lng, p.id));
                    }
                });
                if (count > 0) resultBox.classList.remove('hidden'); else { resultBox.innerHTML = '<div class="px-4 py-3 text-slate-500 text-sm">無符合結果</div>'; resultBox.classList.remove('hidden'); }
            }
        }

        async function performSyncAndEnter() {
            const syncSuccess = await fetchSyncState();
            if (!syncSuccess) alert("⚠️ 讀取雲端資料庫失敗！\n\n由於連線遭到 Google 阻擋，我們將暫時載入您手機中的舊有紀錄。\n請務必重新確認您的 GAS 權限是否有對外開放。");

            const loginScreen = document.getElementById('login-screen');
            if (loginScreen) {
                loginScreen.style.opacity = '0';
                setTimeout(() => loginScreen.style.display = 'none', 500);
            }
            
            const splash = document.getElementById('splash-screen');
            if (splash) {
                splash.style.opacity = '0'; 
                setTimeout(() => splash.style.visibility = 'hidden', 500);
            }
            
            const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
            if (!isStandalone && !localStorage.getItem('pwa_prompt_shown')) {
                setTimeout(() => {
                    const prompt = document.getElementById('pwa-prompt');
                    if (prompt) { prompt.classList.remove('hidden'); setTimeout(() => prompt.classList.remove('translate-y-[-150%]'), 100); }
                    localStorage.setItem('pwa_prompt_shown', 'true');
                }, 2000);
            }

            if(map) map.invalidateSize(); 
            if (currentBounds && map) map.fitBounds(currentBounds);
            
            loadSchedule(scheduleData[0].id);
        }

        async function checkPassword() {
            const pwdInput = document.getElementById('pwd-input');
            const pwdError = document.getElementById('pwd-error');
            if(!pwdInput) return;

            const inputVal = pwdInput.value;
            if (inputVal === SYSTEM_PASSWORD) {
                pwdInput.blur(); window.scrollTo(0, 0);
                if(pwdError) pwdError.style.opacity = '0';
                
                const loginBtn = document.getElementById('btn-login');
                if (loginBtn) loginBtn.innerHTML = '<i class="ph ph-spinner animate-spin text-xl"></i> 同步雲端進度...';
                
                localStorage.setItem('nantou_system_auth', 'true');
                
                await performSyncAndEnter();
            } else {
                if (pwdError) pwdError.style.opacity = '1'; pwdInput.value = '';
            }
        }

        window.onload = () => {
            initMap();
            
            const townshipSelector = document.getElementById('township-selector');
            if (townshipSelector) {
                Object.keys(mapData).forEach((id) => {
                    const btn = document.createElement('div');
                    btn.dataset.id = id;
                    btn.className = `township-pill shrink-0 whitespace-nowrap px-4 py-1.5 rounded-full text-xs font-bold transition-all shadow border bg-slate-800/60 border-slate-700 text-slate-400 cursor-pointer hover:bg-slate-700`;
                    btn.innerText = mapData[id].name;
                    btn.onclick = () => loadTownship(id);
                    townshipSelector.appendChild(btn);
                });
            }

            const scheduleSelector = document.getElementById('schedule-selector');
            if (scheduleSelector) {
                scheduleData.forEach((s) => {
                    const btn = document.createElement('div');
                    btn.dataset.id = s.id;
                    btn.className = `schedule-btn shrink-0 min-w-[120px] flex flex-col items-center justify-center rounded-xl p-2 transition-all cursor-pointer border bg-slate-800/60 border-slate-700 opacity-60 hover:opacity-100`;
                    btn.innerHTML = `<span class="date-text text-slate-300 font-bold text-sm tracking-wide">${s.date}</span><span class="route-text text-slate-500 text-xs font-medium mt-0.5">${s.routeName}</span>`;
                    btn.onclick = () => loadSchedule(s.id);
                    scheduleSelector.appendChild(btn);
                });
            }

            const pwdInput = document.getElementById('pwd-input');
            if(pwdInput) pwdInput.addEventListener('keypress', e => { if (e.key === 'Enter') checkPassword(); });
            
            if (localStorage.getItem('nantou_system_auth') === 'true') {
                const splashText = document.querySelector('#splash-screen .animate-pulse');
                if(splashText) splashText.innerText = '自動登入中，同步雲端資料...';
                
                const loginScreen = document.getElementById('login-screen');
                if (loginScreen) loginScreen.style.display = 'none'; 
                
                performSyncAndEnter(); 
            } else {
                setTimeout(() => { const splash = document.getElementById('splash-screen'); if (splash) { splash.style.opacity = '0'; splash.style.visibility = 'hidden'; } }, 2000); 
            }
        };
        
        function locateUser() {
            const btnIcon = document.querySelector('#locate-btn i');
            if(btnIcon) btnIcon.className = "ph ph-spinner animate-spin text-2xl text-amber-400"; 
            if (!navigator.geolocation) return alert("瀏覽器不支援定位功能！");
            
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const lat = pos.coords.latitude, lng = pos.coords.longitude;
                    if (userMarker && map) map.removeLayer(userMarker);
                    if (map) {
                        userMarker = L.marker([lat, lng], { icon: L.divIcon({ className: 'custom-user-icon', html: `<div class="relative"><div class="user-pulse"></div><div class="user-location-marker"></div></div>`, iconSize: [16, 16], iconAnchor: [8, 8] }), zIndexOffset: 1000 }).addTo(map);
                        map.flyTo([lat, lng], 16, { animate: true, duration: 1.5 });
                    }
                    if(btnIcon) btnIcon.className = "ph-fill ph-crosshair text-2xl text-cyan-400"; 
                },
                () => { alert("無法獲取您的位置！請確認已開啟 GPS 與權限。"); if(btnIcon) btnIcon.className = "ph-fill ph-crosshair text-2xl text-cyan-400"; },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }
    </script>
</body>
</html>
