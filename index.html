    <meta name="theme-color" content="#020617">

    <title>南投縣清潔考核地圖系統</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap');

        html, body { 
            width: 100vw; height: 100dvh; 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: #020617; color: #f8fafc; 
            margin: 0; padding: 0; overflow: hidden; 
            overscroll-behavior: none; 
        }

        .glass { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glass-panel { background: rgba(30, 41, 59, 0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid rgba(255, 255, 255, 0.15); box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.7); }

        #splash-screen, #login-screen { transition: opacity 0.5s ease-in-out; }
        .pulse-ring { animation: pulse 2s infinite cubic-bezier(0.215, 0.61, 0.355, 1); }
        @keyframes pulse { 0% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(6, 182, 212, 0.7); } 70% { transform: scale(1.1); box-shadow: 0 0 0 20px rgba(6, 182, 212, 0); } 100% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(6, 182, 212, 0); } }

        .leaflet-control-attribution { display: none !important; }
        .leaflet-control-zoom { border: none !important; margin-top: 230px !important; }
        .leaflet-bar a { background-color: rgba(30, 41, 59, 0.8) !important; color: #06b6d4 !important; border-color: rgba(255,255,255,0.1) !important;}

        .bottom-sheet { transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); }
        .bottom-sheet.hidden-sheet { transform: translateY(100%); }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .glass-tooltip { background: rgba(15, 23, 42, 0.85) !important; backdrop-filter: blur(4px) !important; border: 1px solid rgba(255, 255, 255, 0.15) !important; color: #f8fafc !important; border-radius: 8px !important; padding: 5px 10px !important; font-size: 12px !important; font-weight: 500 !important; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5) !important; white-space: nowrap !important; }
        .hide-tooltips .glass-tooltip { opacity: 0 !important; visibility: hidden !important; transition: opacity 0.3s ease; }
        
        .user-location-marker { background-color: #3b82f6; border: 2px solid white; border-radius: 50%; width: 16px; height: 16px; box-shadow: 0 0 15px rgba(59, 130, 246, 0.8); position: relative; z-index: 1000; }
        .user-pulse { position: absolute; top: -8px; left: -8px; width: 32px; height: 32px; background-color: rgba(59, 130, 246, 0.6); border-radius: 50%; animation: user-ping 1.5s cubic-bezier(0, 0, 0.2, 1) infinite; }
        @keyframes user-ping { 75%, 100% { transform: scale(2); opacity: 0; } }

        .safe-top-padding { padding-top: max(1rem, env(safe-area-inset-top)); }
        path.leaflet-interactive { transition: stroke-opacity 0.6s ease, stroke-width 0.6s ease, stroke 0.6s ease; }
    </style>
</head>
<body>

    <!-- 1. 歡迎頁 -->
    <div id="splash-screen" class="fixed inset-0 z-[9999] flex flex-col items-center justify-center bg-slate-950">
        <div class="relative flex items-center justify-center w-32 h-32 mb-8">
            <div class="absolute inset-0 rounded-full border-2 border-cyan-500 pulse-ring"></div>
            <i class="ph ph-map-pin-line text-6xl text-cyan-400 drop-shadow-[0_0_15px_rgba(6,182,212,0.8)]"></i>
        </div>
        <h1 class="text-3xl font-bold tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 mb-2">清潔考核系統</h1>
        <p class="text-slate-400 tracking-widest text-sm uppercase">Smart Inspection Map System</p>
        <div class="mt-12 text-cyan-500/50 text-sm animate-pulse">系統載入中 System Loading...</div>
    </div>

    <!-- 1.5 密碼登入頁面 -->
    <div id="login-screen" class="fixed inset-0 z-[9998] flex flex-col items-center justify-center bg-slate-950/95 backdrop-blur-xl">
        <div class="glass-panel p-8 rounded-2xl flex flex-col items-center w-10/12 max-w-sm shadow-2xl border border-cyan-500/30">
            <div class="w-16 h-16 bg-cyan-500/20 rounded-full flex items-center justify-center mb-4">
                <i class="ph-fill ph-lock-key text-3xl text-cyan-400"></i>
            </div>
            <h2 class="text-xl font-bold text-white mb-2 tracking-widest">系統登入</h2>
            <p class="text-slate-400 text-sm mb-6">請輸入授權碼以存取資料</p>
            <input type="password" id="pwd-input" placeholder="請輸入密碼" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-4 py-3 text-white text-center tracking-widest focus:outline-none focus:border-cyan-400 mb-2 transition-colors">
            <p id="pwd-error" class="text-red-400 text-xs mb-4 h-4 opacity-0 transition-opacity">密碼錯誤，請重新輸入</p>
            <button id="btn-login" onclick="checkPassword()" class="w-full bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-bold py-3 px-4 rounded-xl shadow-[0_0_15px_rgba(6,182,212,0.4)] transition-all active:scale-95 tracking-widest cursor-pointer flex justify-center items-center gap-2">
                進入系統
            </button>
        </div>
    </div>

    <!-- PWA 安裝提示 -->
    <div id="pwa-prompt" class="fixed top-4 left-4 right-4 z-[9997] bg-blue-600 text-white p-4 rounded-xl shadow-2xl flex items-start gap-3 hidden transition-transform translate-y-[-150%]">
        <i class="ph-fill ph-info text-2xl"></i>
        <div class="flex-1">
            <h4 class="font-bold mb-1">將系統加入主畫面</h4>
            <p class="text-sm opacity-90 leading-tight">點擊瀏覽器下方的「分享」按鈕，選擇「加入主畫面」，即可像 App 一樣全螢幕使用！</p>
        </div>
        <button onclick="hidePwaPrompt()" class="text-white opacity-70 hover:opacity-100 cursor-pointer"><i class="ph ph-x text-lg"></i></button>
    </div>

    <!-- 2. 主畫面 (地圖容器) -->
    <div id="map" class="absolute inset-0 z-0"></div>

    <!-- 3. UI 覆蓋層 (頂部與底部獨立區塊，防止觸控干擾) -->
    <div id="ui-layer" class="absolute inset-0 z-10 pointer-events-none">
        
        <!-- 頂部選單 -->
        <div class="pointer-events-auto absolute top-0 left-0 w-full safe-top-padding px-4 pb-3 bg-gradient-to-b from-slate-950 via-slate-950/90 to-transparent z-[50]">
            <div class="flex items-center justify-between mb-3 mt-2">
                <h2 class="text-xl font-bold flex items-center gap-2 text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-400">
                    <i class="ph-fill ph-target text-cyan-400"></i>
                    <span id="header-title">請選擇鄉鎮</span>
                </h2>
                <div class="flex gap-2">
                    <button class="glass w-10 h-10 rounded-full text-slate-300 hover:text-white flex justify-center items-center cursor-pointer" onclick="toggleView()" id="btn-toggle-view">
                        <i class="ph-fill ph-list text-xl"></i>
                    </button>
                    <button class="glass w-10 h-10 rounded-full text-slate-300 hover:text-white flex justify-center items-center cursor-pointer" onclick="map.fitBounds(currentBounds)">
                        <i class="ph ph-corners-out text-xl"></i>
                    </button>
                </div>
            </div>

            <!-- 全局搜尋列 -->
            <div class="relative w-full mb-3">
                <i class="ph ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-lg"></i>
                <input type="text" id="search-input" placeholder="搜尋南投縣考核路線或地點..." class="w-full bg-slate-800/80 border border-slate-700 rounded-full pl-10 pr-4 py-2 text-sm text-white focus:outline-none focus:border-cyan-400 transition-colors" oninput="handleSearch()">
                <div id="search-results" class="absolute top-full left-0 right-0 mt-1 bg-slate-800 rounded-xl shadow-2xl z-[60] hidden max-h-48 overflow-y-auto border border-slate-700"></div>
            </div>
            
            <!-- 13鄉鎮市橫向浮動按鈕 -->
            <div class="flex gap-3 overflow-x-auto no-scrollbar py-2 mb-2 w-full touch-pan-x" style="-webkit-overflow-scrolling: touch;" id="township-selector">
                <!-- JavaScript 動態生成按鈕 -->
            </div>

            <!-- 進度條 -->
            <div class="w-full px-1">
                <div class="flex justify-between text-[11px] text-slate-400 font-bold mb-1">
                    <span id="progress-text">本區考核進度：0/5</span>
                    <span id="progress-percent" class="text-cyan-400">0%</span>
                </div>
                <div class="w-full bg-slate-800 rounded-full h-1.5 overflow-hidden">
                    <div id="progress-bar" class="bg-gradient-to-r from-cyan-400 to-blue-500 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <!-- 4. 清單模式 (List View) -->
        <div id="list-view" class="pointer-events-auto absolute inset-0 z-[45] bg-slate-950 overflow-y-auto hidden pt-[230px] pb-10 px-4" style="touch-action: pan-y;">
            <h3 class="text-lg font-bold text-cyan-400 mb-4 flex items-center gap-2 border-b border-slate-800 pb-2">
                <i class="ph-fill ph-list-bullets"></i> 今日行程清單
            </h3>
            <div id="list-container" class="flex flex-col gap-3">
                <!-- JavaScript 動態生成清單 -->
            </div>
        </div>

        <!-- 5. 底部資訊與多照片面板 -->
        <div id="bottom-sheet" class="pointer-events-auto absolute bottom-0 left-0 bottom-sheet hidden-sheet glass-panel w-full rounded-t-3xl p-5 pb-8 shadow-[0_-20px_50px_rgba(0,0,0,0.8)] max-h-[55vh] overflow-y-auto flex flex-col z-[60]" style="touch-action: pan-y;">
            
            <div class="flex justify-between items-center mb-4">
                <div class="w-8 h-1.5"></div>
                <div class="w-12 h-1.5 bg-slate-600 rounded-full cursor-pointer" onclick="hideBottomSheet()"></div>
                <button class="w-8 h-8 flex items-center justify-center rounded-full bg-slate-800/80 text-slate-400 hover:text-white cursor-pointer" onclick="hideBottomSheet()">
                    <i class="ph-bold ph-x text-lg"></i>
                </button>
            </div>
            
            <div id="sheet-content" class="flex-1">
                <div class="flex justify-between items-start mb-2">
                    <h3 class="text-xl font-bold text-white pr-2" id="sheet-title">點位名稱</h3>
                    <button id="mark-btn" class="shrink-0 flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm font-bold transition-all border cursor-pointer" onclick="toggleItemStatus()">
                        <i class="ph-fill ph-check-circle text-lg"></i> <span id="mark-text">未考核</span>
                    </button>
                </div>
                
                <div class="text-sm text-slate-400 mb-5 w-full" id="sheet-desc">詳細資訊</div>
                
                <!-- 照片上傳區 -->
                <div class="mb-5 bg-slate-800/50 p-4 rounded-xl border border-slate-700">
                    <div class="flex justify-between items-center mb-3">
                        <h4 class="text-sm font-bold text-slate-300 flex items-center gap-2">
                            <i class="ph-fill ph-camera text-cyan-400"></i> 照片上傳區
                        </h4>
                        <label class="bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-bold py-1.5 px-3 rounded-lg flex items-center gap-1 cursor-pointer transition-colors shadow-lg">
                            <i class="ph ph-upload-simple text-base"></i> 上傳/拍攝
                            <input type="file" accept="image/*" multiple class="hidden" onchange="handlePhotoUpload(event)">
                        </label>
                    </div>
                    <div id="photo-preview-grid" class="grid grid-cols-3 gap-2 mb-3 empty:hidden"></div>
                    <button id="btn-upload-drive" onclick="uploadPhotosToDrive()" class="w-full bg-slate-700 hover:bg-slate-600 border border-slate-600 text-white text-sm font-bold py-2.5 rounded-lg flex items-center justify-center gap-2 transition-colors mt-2 cursor-pointer shadow-lg">
                        <i class="ph-fill ph-cloud-arrow-up text-lg text-fuchsia-400"></i> 一鍵同步至 Google Drive
                    </button>
                </div>

                <button id="nav-btn" class="w-full bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-bold py-3.5 px-4 rounded-xl flex items-center justify-center gap-2 shadow-lg transition-all active:scale-95 hidden cursor-pointer">
                    <i class="ph-fill ph-navigation-arrow text-xl"></i>
                    <span>開啟 Google Maps 導航</span>
                </button>
            </div>
        </div>

        <!-- 6. 實時定位按鈕 -->
        <button id="locate-btn" class="pointer-events-auto absolute bottom-8 right-4 z-[40] glass p-3 rounded-full text-cyan-400 hover:text-white shadow-[0_0_15px_rgba(6,182,212,0.3)] transition-all active:scale-95 cursor-pointer" onclick="locateUser()">
            <i class="ph-fill ph-crosshair text-2xl"></i>
        </button>
    </div>

                ] 
            }

        // --- 狀態保存 ---
        let inspectionState = JSON.parse(localStorage.getItem('nantou_inspection')) || {};
        let inspectionPhotos = JSON.parse(localStorage.getItem('nantou_photos_v2')) || {}; 
        let currentTownshipId = null;
        let currentItemId = null; 

        // 🌟 新增：向 Google 雲端讀取團隊最新進度
        async function fetchSyncState() {
            try {
                const res = await fetch(GOOGLE_APP_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'get_status' })
                });
                const result = await res.json();
                if (result.status === 'success' && result.data) {
                    inspectionState = result.data;
                    localStorage.setItem('nantou_inspection', JSON.stringify(inspectionState));
                }
            } catch(e) {
                console.error("雲端狀態同步失敗，使用本機狀態", e);
            }
        }

        // 儲存狀態並發送至雲端
        function saveState() {
            localStorage.setItem('nantou_inspection', JSON.stringify(inspectionState));
            try { 
                localStorage.setItem('nantou_photos_v2', JSON.stringify(inspectionPhotos)); 
            } catch(e) { 
                alert("手機暫存空間已滿！請先清除已上傳的照片。"); 
            }
            updateProgressBar();
            if(!isListView) {
                updateMarkersStatus();
            } else {
                renderListView(); 
            }
        }

        // --- 地圖核心 ---
        let map;
        let activeLayers = [];
        let routePolylines = {}; 
        let currentBounds = null;
        let userMarker = null;
        let isListView = false;

        function createCustomIcon(iconColor, iconName, opacity=1) {
            return L.divIcon({ 
                className: 'custom-leaflet-icon', 
                html: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" style="opacity:${opacity}">
                        <circle cx="20" cy="20" r="18" fill="rgba(15, 23, 42, 0.8)" stroke="${iconColor}" stroke-width="2"/>
                        ${opacity === 1 ? `<circle cx="20" cy="20" r="24" fill="none" stroke="${iconColor}" stroke-width="1" opacity="0.4" class="pulse"/>` : ''}
                        <foreignObject x="8" y="8" width="24" height="24">
                            <div xmlns="http://www.w3.org/1999/xhtml" style="display:flex; justify-content:center; align-items:center; height:100%; color:${iconColor}; font-size:18px;">
                                <i class="${iconName}"></i>
                            </div>
                        </foreignObject>
                       </svg>`, 
                iconSize: [40, 40], iconAnchor: [20, 20] 
            });
        }

        function getIcons(isDone) { 
            return { 
                office: createCustomIcon(isDone ? '#64748b' : '#38bdf8', 'ph-fill ph-bank', isDone ? 0.6 : 1), 
                restaurant: createCustomIcon(isDone ? '#64748b' : '#fbbf24', 'ph-fill ph-fork-knife', isDone ? 0.6 : 1), 
                start: createCustomIcon(isDone ? '#64748b' : '#4ade80', 'ph-fill ph-flag-pennant', isDone ? 0.6 : 1), 
                end: createCustomIcon(isDone ? '#64748b' : '#f87171', 'ph-fill ph-flag-checkered', isDone ? 0.6 : 1) 
            }; 
        }

        function initMap() {
            map = L.map('map', { zoomControl: false, tap: false }).setView([23.903, 120.951], 10);
            L.control.zoom({ position: 'topright' }).addTo(map);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { 
                attribution: '&copy; OpenStreetMap', subdomains: 'abcd', maxZoom: 20 
            }).addTo(map);
            
            // 點擊地圖空白處，自動關閉面板並恢復全地圖視野
            map.on('click', function() {
                const bs = document.getElementById('bottom-sheet');
                if(bs && !bs.classList.contains('hidden-sheet')) {
                    hideBottomSheet();
                }
            });

            map.on('zoomend', function() { 
                const mapEl = document.getElementById('map');
                if (mapEl) {
                    if(map.getZoom() < 14) mapEl.classList.add('hide-tooltips');
                    else mapEl.classList.remove('hide-tooltips');
                }
            });
        }

        function updateMarkersStatus() {
            loadTownship(currentTownshipId, true);
        }

        // 🌟 電影級運鏡與高亮邏輯
        function highlightRoute(townshipId, itemId) {
            Object.keys(routePolylines).forEach(key => {
                const isDone = inspectionState[key];
                const originalColor = routePolylines[key].options.originalColor;
                routePolylines[key].setStyle({
                    color: isDone ? '#475569' : originalColor,
                    weight: 4,
                    opacity: 0.25
                });
            });

            if (routePolylines[itemId]) {
                const isDone = inspectionState[itemId];
                const originalColor = routePolylines[itemId].options.originalColor;
                routePolylines[itemId].setStyle({
                    color: isDone ? '#94a3b8' : originalColor,
                    weight: 8,
                    opacity: 1
                });
                routePolylines[itemId].bringToFront(); 
                
                map.flyToBounds(routePolylines[itemId].getBounds(), {
                    paddingTopLeft: [30, 200], 
                    paddingBottomRight: [30, window.innerHeight * 0.45], 
                    maxZoom: 16,
                    animate: true,
                    duration: 1.2
                });
            }
        }

        function resetRouteHighlights() {
            Object.keys(routePolylines).forEach(k => {
                const originalColor = routePolylines[k].options.originalColor;
                const isDashed = routePolylines[k].options.isDashed;
                const isDone = inspectionState[k];
                routePolylines[k].setStyle({ 
                    weight: isDashed ? 5 : 8, 
                    color: isDone ? '#475569' : originalColor, 
                    opacity: isDone ? 0.6 : 0.9 
                });
            });
            if (currentBounds) map.flyToBounds(currentBounds, { padding: [50, 50], animate: true, duration: 1.2 });
        }

        function loadTownship(id, keepHighlight = false) {
            currentTownshipId = id;
            const data = mapData[id];
            if (!data) return;

            document.getElementById('header-title').innerText = `${data.name} 考核點位`;
            
            document.querySelectorAll('.township-btn').forEach(btn => {
                if(btn.dataset.id === id) {
                    btn.className = 'township-btn shrink-0 whitespace-nowrap px-5 py-2.5 rounded-full text-sm font-bold transition-all shadow-lg bg-cyan-600 border border-cyan-400 text-white cursor-pointer';
                } else {
                    btn.className = 'township-btn shrink-0 whitespace-nowrap px-5 py-2.5 rounded-full text-sm font-bold transition-all shadow-lg bg-slate-800/80 border border-slate-600 text-slate-300 backdrop-blur-md cursor-pointer hover:bg-slate-700';
                }
            });

            activeLayers.forEach(layer => map.removeLayer(layer)); 
            activeLayers = [];
            routePolylines = {};
            
            if (!keepHighlight) hideBottomSheet(); 

            updateProgressBar();
            const bounds = [];
            
            const drawPOI = (poi, itemId) => {
                const isDone = inspectionState[itemId];
                const marker = L.marker([poi.lat, poi.lng], { icon: getIcons(isDone)[poi.type] }).addTo(map);
                
                marker.on('click', (e) => {
                    L.DomEvent.stopPropagation(e);
                    resetRouteHighlights();
                    map.flyTo([poi.lat, poi.lng], 16, { animate: true, duration: 1.2 });
                    showBottomSheet(poi.name, `類型：${poi.type === 'office' ? '鄉鎮公所' : '聚餐餐廳'}`, poi.lat, poi.lng, itemId);
                });
                
                const colorClass = isDone ? 'text-slate-400' : (poi.type === 'office' ? 'text-sky-400' : 'text-amber-400');
                marker.bindTooltip(`<span class="${colorClass} font-bold">${poi.name}${isDone ? ' (已完成)' : ''}</span>`, { 
                    permanent: true, direction: 'top', className: 'glass-tooltip', offset: [0, -20] 
                });
                
                activeLayers.push(marker); 
                bounds.push([poi.lat, poi.lng]);
            };

            drawPOI(data.office, `${id}_office`); 
            drawPOI(data.restaurant, `${id}_restaurant`);

            data.routes.forEach(route => {
                const itemId = `${id}_route_${route.id}`;
                const isDone = inspectionState[itemId];
                const routeColor = isDone ? '#475569' : route.color;
                const opacity = isDone ? 0.6 : 0.9;
                
                const startPt = route.path[0];
                const endPt = route.path[route.path.length - 1];
                
                const isDashed = route.path.length === 2;

                const polyline = L.polyline(route.path, { 
                    color: routeColor, weight: isDashed ? 5 : 8, opacity: opacity, 
                    dashArray: isDashed ? '10, 10' : null, 
                    lineCap: 'round', lineJoin: 'round',
                    originalColor: route.color, isDashed: isDashed
                }).addTo(map);
                
                routePolylines[itemId] = polyline; 

                const startMarker = L.marker(startPt, { icon: getIcons(isDone).start }).addTo(map);
                const endMarker = L.marker(endPt, { icon: getIcons(isDone).end }).addTo(map);

                const openSheet = (e) => {
                    L.DomEvent.stopPropagation(e);
                    highlightRoute(id, itemId); 

                    const descHTML = `
                        <div class="flex flex-col gap-2 mt-1 mb-3">
                            <div class="bg-slate-800/90 p-3 rounded-xl border border-emerald-500/30 flex items-center justify-between shadow-lg relative overflow-hidden">
                                <div class="absolute -right-4 -top-4 w-16 h-16 bg-emerald-500/10 rounded-full"></div>
                                <div class="flex items-center gap-3 relative z-10">
                                    <div class="w-10 h-10 rounded-full bg-emerald-500/20 flex items-center justify-center text-emerald-400 shrink-0"><i class="ph-fill ph-flag-pennant text-xl"></i></div>
                                    <div>
                                        <div class="font-bold text-white text-sm tracking-wide">起點：${route.name}起點</div>
                                        <div class="text-[11px] text-slate-400 font-mono mt-0.5">${startPt[0].toFixed(5)}, ${startPt[1].toFixed(5)}</div>
                                    </div>
                                </div>
                                <button onclick="window.open('https://www.google.com/maps/dir/?api=1&destination=${startPt[0]},${startPt[1]}', '_blank')" class="bg-emerald-600 hover:bg-emerald-500 text-white w-10 h-10 rounded-full flex items-center justify-center shadow-lg active:scale-95 relative z-10 shrink-0 cursor-pointer"><i class="ph-bold ph-navigation-arrow text-lg"></i></button>
                            </div>
                            
                            <div class="w-1 h-3 bg-gradient-to-b from-emerald-500/50 to-rose-500/50 mx-auto rounded-full"></div>
                            
                            <div class="bg-slate-800/90 p-3 rounded-xl border border-rose-500/30 flex items-center justify-between shadow-lg relative overflow-hidden">
                                <div class="absolute -right-4 -top-4 w-16 h-16 bg-rose-500/10 rounded-full"></div>
                                <div class="flex items-center gap-3 relative z-10">
                                    <div class="w-10 h-10 rounded-full bg-rose-500/20 flex items-center justify-center text-rose-400 shrink-0"><i class="ph-fill ph-flag-checkered text-xl"></i></div>
                                    <div>
                                        <div class="font-bold text-white text-sm tracking-wide">終點：${route.name}終點</div>
                                        <div class="text-[11px] text-slate-400 font-mono mt-0.5">${endPt[0].toFixed(5)}, ${endPt[1].toFixed(5)}</div>
                                    </div>
                                </div>
                                <button onclick="window.open('https://www.google.com/maps/dir/?api=1&destination=${endPt[0]},${endPt[1]}', '_blank')" class="bg-rose-600 hover:bg-rose-500 text-white w-10 h-10 rounded-full flex items-center justify-center shadow-lg active:scale-95 relative z-10 shrink-0 cursor-pointer"><i class="ph-bold ph-navigation-arrow text-lg"></i></button>
                            </div>
                        </div>
                    `;
                    showBottomSheet(route.name, descHTML, 0, 0, itemId, true);
                };
                
                polyline.on('click', openSheet); 
                startMarker.on('click', openSheet); 
                endMarker.on('click', openSheet);
                
                startMarker.bindTooltip(`<div class="${isDone ? 'text-slate-400' : 'text-green-400'} font-bold mb-0.5">🟢 起點</div><div class="text-slate-200">${route.name}</div>`, { permanent: true, direction: 'right', className: 'glass-tooltip text-center', offset: [15, 0] });
                endMarker.bindTooltip(`<div class="${isDone ? 'text-slate-400' : 'text-red-400'} font-bold mb-0.5">🏁 終點</div><div class="text-slate-200">${route.name}</div>`, { permanent: true, direction: 'left', className: 'glass-tooltip text-center', offset: [-15, 0] });

                activeLayers.push(polyline, startMarker, endMarker); 
                route.path.forEach(pt => bounds.push(pt));
            });

            if (!keepHighlight) {
                currentBounds = L.latLngBounds(bounds);
                map.fitBounds(currentBounds, { padding: [50, 50], animate: true, duration: 1 });
            } else if (currentItemId && currentItemId.includes('_route_')) {
                highlightRoute(currentTownshipId, currentItemId);
            }
        }

        function updateProgressBar() {
            if(!currentTownshipId) return;
            const data = mapData[currentTownshipId];
            const total = 2 + data.routes.length;
            let comp = 0;
            
            if(inspectionState[`${currentTownshipId}_office`]) comp++;
            if(inspectionState[`${currentTownshipId}_restaurant`]) comp++;
            data.routes.forEach(r => { 
                if(inspectionState[`${currentTownshipId}_route_${r.id}`]) comp++; 
            });
            
            const pct = Math.round((comp / total) * 100);
            document.getElementById('progress-text').innerText = `本區進度：${comp} / ${total} 點位`;
            document.getElementById('progress-percent').innerText = `${pct}%`;
            document.getElementById('progress-bar').style.width = `${pct}%`;
        }

        // 🌟 狀態同步：打卡時不僅本機記錄，還會背景發送到雲端
        async function toggleItemStatus() {
            if(!currentItemId) return;
            const newState = !inspectionState[currentItemId];
            inspectionState[currentItemId] = newState;
            
            // 立即更新 UI，保持順暢感
            saveState(); 
            
            const btn = document.getElementById('mark-btn');
            if (newState) {
                btn.className = "shrink-0 flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm font-bold transition-all bg-emerald-500/20 border-emerald-500 text-emerald-400 cursor-pointer";
                document.getElementById('mark-text').innerText = "已考核";
            } else {
                btn.className = "shrink-0 flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm font-bold transition-all bg-slate-800 border-slate-600 text-slate-300 cursor-pointer";
                document.getElementById('mark-text').innerText = "未考核";
            }

            // 在背景將最新狀態同步至 Google 雲端
            try {
                fetch(GOOGLE_APP_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'set_status', itemId: currentItemId, isDone: newState })
                });
            } catch(e) {
                console.error("狀態同步失敗", e);
            }
        }

        function handlePhotoUpload(event) {
            const files = event.target.files;
            if(!files.length || !currentItemId) return;

            if (!inspectionPhotos[currentItemId]) inspectionPhotos[currentItemId] = [];
            const grid = document.getElementById('photo-preview-grid');
            
            grid.innerHTML += `<div class="col-span-3 text-center text-emerald-400 text-sm py-2 font-bold animate-pulse" id="loading-txt"><i class="ph ph-spinner animate-spin"></i> 照片已準備上傳...</div>`;

            let processed = 0;
            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 800; 
                        let w = img.width, h = img.height;
                        if (w > MAX_WIDTH) { h *= MAX_WIDTH / w; w = MAX_WIDTH; }
                        canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        
                        inspectionPhotos[currentItemId].push({
                            id: Date.now() + Math.random(),
                            data: canvas.toDataURL('image/jpeg', 0.6), 
                            uploaded: false 
                        });
                        
                        processed++;
                        if(processed === files.length) {
                            saveState();
                            renderPhotos();
                        }
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
            event.target.value = '';
        }

        function renderPhotos() {
            const grid = document.getElementById('photo-preview-grid');
            const photos = inspectionPhotos[currentItemId] || [];
            grid.innerHTML = '';
            let hasPending = false;

            photos.forEach((photo) => {
                if(!photo.uploaded) hasPending = true;
                grid.innerHTML += `
                    <div class="relative w-full aspect-square rounded-lg border border-slate-600 overflow-hidden group">
                        <img src="${photo.data}" class="w-full h-full object-cover">
                        ${photo.uploaded 
                            ? `<div class="absolute inset-0 bg-black/40 flex items-center justify-center"><i class="ph-fill ph-check-circle text-emerald-400 text-3xl drop-shadow-md"></i></div>` 
                            : `<button onclick="deletePhoto('${photo.id}')" class="absolute top-1 right-1 bg-red-500/80 text-white w-6 h-6 rounded-full flex items-center justify-center backdrop-blur cursor-pointer"><i class="ph-bold ph-x text-xs"></i></button>`
                        }
                    </div>
                `;
            });

            if(hasPending) {
                grid.innerHTML += `<div class="col-span-3 text-center text-emerald-400 text-sm py-1 mt-1 font-bold animate-pulse"><i class="ph-fill ph-check-circle"></i> 照片已暫存，請點擊下方按鈕同步</div>`;
            }
        }

        function deletePhoto(photoId) {
            if(!confirm("確定要刪除這張尚未上傳的照片嗎？")) return;
            inspectionPhotos[currentItemId] = inspectionPhotos[currentItemId].filter(p => p.id !== photoId);
            saveState(); 
            renderPhotos();
        }

        // --- ☁️ 同步上傳至 Google Drive ---
        async function uploadPhotosToDrive() {
            const photos = inspectionPhotos[currentItemId] || [];
            const pendingPhotos = photos.filter(p => !p.uploaded);
            
            if (pendingPhotos.length === 0) return alert("目前沒有需要上傳的新照片！\n(已打勾的照片代表已經安全存入您的雲端硬碟)");
            if (GOOGLE_APP_SCRIPT_URL.includes("在此處貼上")) return alert("⚠️ 系統管理員尚未設定 Google Apps Script 網址！");

            const btn = document.getElementById('btn-upload-drive');
            if (btn) {
                btn.innerHTML = '<i class="ph ph-spinner animate-spin text-lg"></i> 上傳中，請勿關閉螢幕...';
                btn.disabled = true; 
                btn.classList.add('opacity-50');
            }

            const townshipName = mapData[currentTownshipId].name;
            const pointName = document.getElementById('sheet-title').innerText.replace('考核點位', '').trim();
            let successCount = 0;

            for (let i = 0; i < photos.length; i++) {
                if (photos[i].uploaded) continue;
                const base64Data = photos[i].data.split(',')[1];
                const fileName = `${townshipName}_${pointName}_${Date.now()}.jpg`;

                try {
                    const response = await fetch(GOOGLE_APP_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({ 
                            action: 'upload_photo', // 告訴後端這是上傳照片的指令
                            township: townshipName, 
                            pointName: pointName, 
                            filename: fileName, 
                            mimeType: "image/jpeg", 
                            base64: base64Data 
                        })
                    });
                    const result = await response.json();
                    if (result.status === "success") { photos[i].uploaded = true; successCount++; }
                } catch (err) { console.error("上傳失敗", err); }
            }

            saveState(); renderPhotos();
            if (btn) {
                btn.disabled = false; 
                btn.classList.remove('opacity-50');
                btn.innerHTML = '<i class="ph-fill ph-cloud-arrow-up text-lg text-fuchsia-400"></i> 一鍵同步至 Google Drive';
            }

            if(successCount === pendingPhotos.length) alert("✅ 所有新照片已成功上傳至雲端硬碟！");
            else alert(`⚠️ 上傳完畢。成功: ${successCount} 張，失敗: ${pendingPhotos.length - successCount} 張。\n請稍後再試一次。`);
        }

        function showBottomSheet(title, desc, lat, lng, itemId, isRoute = false) {
            currentItemId = itemId;
            document.getElementById('sheet-title').innerText = title;
            document.getElementById('sheet-desc').innerHTML = desc;
            
            const isDone = inspectionState[itemId];
            const btn = document.getElementById('mark-btn');
            
            if (isDone) {
                btn.className = "shrink-0 flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm font-bold transition-all bg-emerald-500/20 border-emerald-500 text-emerald-400 cursor-pointer";
                document.getElementById('mark-text').innerText = "已考核";
            } else {
                btn.className = "shrink-0 flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm font-bold transition-all bg-slate-800 border-slate-600 text-slate-300 cursor-pointer";
                document.getElementById('mark-text').innerText = "未考核";
            }

            renderPhotos();
            
            const navBtn = document.getElementById('nav-btn');
            if (navBtn) {
                if (isRoute) {
                    navBtn.classList.add('hidden');
                } else {
                    navBtn.classList.remove('hidden');
                    navBtn.onclick = () => { window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`, '_blank'); };
                }
            }
            
            const bs = document.getElementById('bottom-sheet');
            if (bs) bs.classList.remove('hidden-sheet');
        }

        function hideBottomSheet() { 
            const bs = document.getElementById('bottom-sheet');
            if(!bs || bs.classList.contains('hidden-sheet')) return;
            
            bs.classList.add('hidden-sheet'); 
            currentItemId = null; 
            resetRouteHighlights();
        }

        function hidePwaPrompt() {
            const prompt = document.getElementById('pwa-prompt');
            if (prompt) prompt.classList.add('hidden');
        }

        function toggleView() {
            isListView = !isListView;
            const listEl = document.getElementById('list-view');
            const btnIcon = document.querySelector('#btn-toggle-view i');
            hideBottomSheet();

            if (listEl && btnIcon) {
                if (isListView) {
                    listEl.classList.remove('hidden');
                    btnIcon.className = "ph-fill ph-map-trifold text-xl text-cyan-400";
                    renderListView();
                } else {
                    listEl.classList.add('hidden');
                    btnIcon.className = "ph-fill ph-list text-xl";
                    if (map) map.invalidateSize(); 
                }
            }
        }

        function renderListView(filterText = "") {
            const container = document.getElementById('list-container');
            container.innerHTML = '';
            
            const renderItem = (title, type, lat, lng, itemId, tId) => {
                if (filterText && !title.includes(filterText) && !mapData[tId].name.includes(filterText)) return;
                
                const isDone = inspectionState[itemId];
                const hasPhoto = (inspectionPhotos[itemId] && inspectionPhotos[itemId].length > 0);
                
                container.innerHTML += `
                    <div class="bg-slate-900 border ${isDone ? 'border-emerald-500/30' : 'border-slate-700'} p-4 rounded-xl shadow-lg flex items-center justify-between cursor-pointer active:scale-95 transition-transform" onclick="jumpToMap('${tId}', '${itemId}', ${lat}, ${lng}, '${title}')">
                        <div>
                            <div class="text-xs text-slate-400 mb-1 flex gap-2">
                                <span class="bg-slate-800 px-2 py-0.5 rounded">${mapData[tId].name}</span>
                                ${isDone ? '<span class="text-emerald-400"><i class="ph-fill ph-check-circle"></i> 已完勘</span>' : ''}
                                ${hasPhoto ? '<span class="text-amber-400"><i class="ph-fill ph-camera"></i> 照片</span>' : ''}
                            </div>
                            <h4 class="text-white font-bold text-lg">${title}</h4>
                        </div>
                        <div class="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center text-cyan-400">
                            <i class="ph-fill ph-navigation-arrow text-lg"></i>
                        </div>
                    </div>
                `;
            };

            const targets = filterText ? Object.keys(mapData) : [currentTownshipId];
            targets.forEach(tId => {
                const d = mapData[tId];
                renderItem(d.office.name, 'office', d.office.lat, d.office.lng, `${tId}_office`, tId);
                d.routes.forEach(r => renderItem(r.name, 'route', r.path[0][0], r.path[0][1], `${tId}_route_${r.id}`, tId));
                renderItem(d.restaurant.name, 'restaurant', d.restaurant.lat, d.restaurant.lng, `${tId}_restaurant`, tId);
            });

            if(container.innerHTML === '') container.innerHTML = '<p class="text-slate-500 text-center py-10">找不到符合的地點或路線</p>';
        }

        function jumpToMap(tId, itemId, lat, lng, title) {
            if (isListView) toggleView();
            if (tId !== currentTownshipId) loadTownship(tId);
            
            if (itemId.includes('_route_')) {
                const routeId = parseInt(itemId.split('_route_')[1]);
                const route = mapData[tId].routes.find(r => r.id === routeId);
                const startPt = route.path[0];
                const endPt = route.path[route.path.length-1];
                
                const descHTML = `
                    <div class="flex flex-col gap-2 mt-1 mb-3">
                        <div class="bg-slate-800/90 p-3 rounded-xl border border-emerald-500/30 flex items-center justify-between shadow-lg relative overflow-hidden">
                            <div class="absolute -right-4 -top-4 w-16 h-16 bg-emerald-500/10 rounded-full"></div>
                            <div class="flex items-center gap-3 relative z-10">
                                <div class="w-10 h-10 rounded-full bg-emerald-500/20 flex items-center justify-center text-emerald-400 shrink-0"><i class="ph-fill ph-flag-pennant text-xl"></i></div>
                                <div>
                                    <div class="font-bold text-white text-sm tracking-wide">起點：${route.name}起點</div>
                                    <div class="text-[11px] text-slate-400 font-mono mt-0.5">${startPt[0].toFixed(5)}, ${startPt[1].toFixed(5)}</div>
                                </div>
                            </div>
                            <button onclick="window.open('https://www.google.com/maps/dir/?api=1&destination=${startPt[0]},${startPt[1]}', '_blank')" class="bg-emerald-600 hover:bg-emerald-500 text-white w-10 h-10 rounded-full flex items-center justify-center shadow-lg active:scale-95 relative z-10 shrink-0 cursor-pointer"><i class="ph-bold ph-navigation-arrow text-lg"></i></button>
                        </div>
                        <div class="w-1 h-3 bg-gradient-to-b from-emerald-500/50 to-rose-500/50 mx-auto rounded-full"></div>
                        <div class="bg-slate-800/90 p-3 rounded-xl border border-rose-500/30 flex items-center justify-between shadow-lg relative overflow-hidden">
                            <div class="absolute -right-4 -top-4 w-16 h-16 bg-rose-500/10 rounded-full"></div>
                            <div class="flex items-center gap-3 relative z-10">
                                <div class="w-10 h-10 rounded-full bg-rose-500/20 flex items-center justify-center text-rose-400 shrink-0"><i class="ph-fill ph-flag-checkered text-xl"></i></div>
                                <div>
                                    <div class="font-bold text-white text-sm tracking-wide">終點：${route.name}終點</div>
                                    <div class="text-[11px] text-slate-400 font-mono mt-0.5">${endPt[0].toFixed(5)}, ${endPt[1].toFixed(5)}</div>
                                </div>
                            </div>
                            <button onclick="window.open('https://www.google.com/maps/dir/?api=1&destination=${endPt[0]},${endPt[1]}', '_blank')" class="bg-rose-600 hover:bg-rose-500 text-white w-10 h-10 rounded-full flex items-center justify-center shadow-lg active:scale-95 relative z-10 shrink-0 cursor-pointer"><i class="ph-bold ph-navigation-arrow text-lg"></i></button>
                        </div>
                    </div>`;
                highlightRoute(tId, itemId);
                showBottomSheet(title, descHTML, 0, 0, itemId, true);
            } else {
                resetRouteHighlights();
                map.flyTo([lat, lng], 16, { animate: true, duration: 1.2 });
                setTimeout(() => {
                    showBottomSheet(title, `類型：${itemId.includes('office') ? '鄉鎮公所' : '聚餐餐廳'}`, lat, lng, itemId);
                }, 1000);
            }
        }

        function handleSearch() {
            const input = document.getElementById('search-input').value.trim();
            const resultBox = document.getElementById('search-results');
            
            if (input.length === 0) {
                if(resultBox) resultBox.classList.add('hidden');
                if (isListView) renderListView(); 
                return;
            }

            if (isListView) { 
                renderListView(input); 
            } else {
                if(resultBox) resultBox.innerHTML = '';
                let count = 0;
                Object.keys(mapData).forEach(tId => {
                    const d = mapData[tId];
                    const checkAdd = (name, lat, lng, itemId) => {
                        if (name.includes(input) || d.name.includes(input)) {
                            count++;
                            if(resultBox) {
                                resultBox.innerHTML += `
                                    <div class="px-4 py-3 hover:bg-slate-700 cursor-pointer border-b border-slate-700 last:border-0" onclick="jumpToMap('${tId}', '${itemId}', ${lat}, ${lng}, '${name}'); document.getElementById('search-results').classList.add('hidden');">
                                        <div class="text-xs text-cyan-400 mb-0.5">${d.name}</div>
                                        <div class="text-white font-medium">${name}</div>
                                    </div>`;
                            }
                        }
                    };
                    checkAdd(d.office.name, d.office.lat, d.office.lng, `${tId}_office`);
                    d.routes.forEach(r => checkAdd(r.name, r.path[0][0], r.path[0][1], `${tId}_route_${r.id}`));
                    checkAdd(d.restaurant.name, d.restaurant.lat, d.restaurant.lng, `${tId}_restaurant`);
                });
                
                if (count > 0) {
                    if (resultBox) resultBox.classList.remove('hidden');
                } else {
                    if (resultBox) {
                        resultBox.innerHTML = '<div class="px-4 py-3 text-slate-500 text-sm">無符合結果</div>';
                        resultBox.classList.remove('hidden');
                    }
                }
            }
        }

        // 🌟 登入與啟動 (包含視角歸零、收起鍵盤與雲端讀取)
        async function checkPassword() {
            const inputVal = document.getElementById('pwd-input').value;
            if (inputVal === SYSTEM_PASSWORD) {
                // 1. 強制收起虛擬鍵盤，並將頁面滾動回最頂部 (解決 iPhone 跑版問題)
                document.getElementById('pwd-input').blur();
                window.scrollTo(0, 0);

                document.getElementById('pwd-error').style.opacity = '0';
                
                // 按鈕改為載入中狀態
                const loginBtn = document.getElementById('btn-login');
                loginBtn.innerHTML = '<i class="ph ph-spinner animate-spin text-xl"></i> 同步雲端進度...';
                
                // 2. 向雲端讀取最新團隊進度
                await fetchSyncState();

                // 3. 切換畫面
                const loginScreen = document.getElementById('login-screen');
                loginScreen.style.opacity = '0';
                
                const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
                if (!isStandalone && !localStorage.getItem('pwa_prompt_shown')) {
                    setTimeout(() => {
                        const prompt = document.getElementById('pwa-prompt');
                        if (prompt) {
                            prompt.classList.remove('hidden');
                            setTimeout(() => prompt.classList.remove('translate-y-[-150%]'), 100);
                        }
                        localStorage.setItem('pwa_prompt_shown', 'true');
                    }, 2000);
                }

                setTimeout(() => { 
                    loginScreen.style.display = 'none'; 
                    if(map) map.invalidateSize(); 
                    if (currentBounds && map) map.fitBounds(currentBounds);
                    
                    // 根據雲端進度重繪地圖標記
                    loadTownship(currentTownshipId);
                }, 500);
            } else {
                document.getElementById('pwd-error').style.opacity = '1';
                document.getElementById('pwd-input').value = '';
            }
        }

        window.onload = () => {
            initMap();
            
            const selector = document.getElementById('township-selector');
            if (selector) {
                Object.keys(mapData).forEach((id, index) => {
                    const btn = document.createElement('button');
                    btn.dataset.id = id;
                    btn.className = `township-btn shrink-0 whitespace-nowrap px-5 py-2.5 rounded-full text-sm font-bold transition-all shadow-lg ${index === 0 ? 'bg-cyan-600 border border-cyan-400 text-white' : 'bg-slate-800/80 border border-slate-600 text-slate-300 backdrop-blur-md'} cursor-pointer`;
                    btn.innerText = mapData[id].name;
                    btn.onclick = () => loadTownship(id);
                    selector.appendChild(btn);
                });
            }
            
            // 預設先載入草屯的地圖 UI (狀態會等登入後覆蓋)
            loadTownship(Object.keys(mapData)[0]);

            const pwdInput = document.getElementById('pwd-input');
            if(pwdInput) {
                pwdInput.addEventListener('keypress', e => { 
                    if (e.key === 'Enter') checkPassword(); 
                });
            }
            
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                if (splash) {
                    splash.style.opacity = '0';
                    splash.style.visibility = 'hidden';
                }
            }, 2000); 
        };
        
        function locateUser() {
            const btnIcon = document.querySelector('#locate-btn i');
            if(btnIcon) btnIcon.className = "ph ph-spinner animate-spin text-2xl text-amber-400"; 
            
            if (!navigator.geolocation) return alert("瀏覽器不支援定位功能！");
            
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const lat = pos.coords.latitude, lng = pos.coords.longitude;
                    if (userMarker && map) map.removeLayer(userMarker);
                    
                    if (map) {
                        userMarker = L.marker([lat, lng], { 
                            icon: L.divIcon({ 
                                className: 'custom-user-icon', 
                                html: `<div class="relative"><div class="user-pulse"></div><div class="user-location-marker"></div></div>`, 
                                iconSize: [16, 16], iconAnchor: [8, 8] 
                            }), zIndexOffset: 1000 
                        }).addTo(map);
                        
                        map.flyTo([lat, lng], 16, { animate: true, duration: 1.5 });
                    }
                    if(btnIcon) btnIcon.className = "ph-fill ph-crosshair text-2xl text-cyan-400"; 
                },
                () => { 
                    alert("無法獲取您的位置！請確認已開啟 GPS 與權限。"); 
                    if(btnIcon) btnIcon.className = "ph-fill ph-crosshair text-2xl text-cyan-400"; 
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }
    </script>
</body>
</html>
