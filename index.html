    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap');

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #020617; 
            color: #f8fafc;
            overflow: hidden;
            margin: 0;
            padding: 0;
            touch-action: pan-x pan-y; 
        }

        .glass { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glass-panel { background: rgba(30, 41, 59, 0.9); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid rgba(255, 255, 255, 0.15); box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5); }

        #splash-screen, #login-screen { transition: opacity 0.5s ease-in-out; }
        .pulse-ring { animation: pulse 2s infinite cubic-bezier(0.215, 0.61, 0.355, 1); }
        @keyframes pulse {
            0% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(6, 182, 212, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 20px rgba(6, 182, 212, 0); }
            100% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(6, 182, 212, 0); }
        }

        .leaflet-control-attribution { display: none !important; }
        .leaflet-control-zoom { border: none !important; margin-top: 150px !important; }
        .leaflet-bar a { background-color: rgba(30, 41, 59, 0.8) !important; color: #06b6d4 !important; border-color: rgba(255,255,255,0.1) !important;}

        .bottom-sheet { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .bottom-sheet.hidden-sheet { transform: translateY(100%); }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .glass-tooltip {
            background: rgba(15, 23, 42, 0.85) !important;
            backdrop-filter: blur(4px) !important; border: 1px solid rgba(255, 255, 255, 0.15) !important;
            color: #f8fafc !important; border-radius: 8px !important; padding: 5px 10px !important;
            font-size: 12px !important; font-weight: 500 !important; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5) !important; white-space: nowrap !important;
        }
        .hide-tooltips .glass-tooltip { opacity: 0 !important; visibility: hidden !important; transition: opacity 0.3s ease; }
        
        .user-location-marker { background-color: #3b82f6; border: 2px solid white; border-radius: 50%; width: 16px; height: 16px; box-shadow: 0 0 15px rgba(59, 130, 246, 0.8); position: relative; z-index: 1000; }
        .user-pulse { position: absolute; top: -8px; left: -8px; width: 32px; height: 32px; background-color: rgba(59, 130, 246, 0.6); border-radius: 50%; animation: user-ping 1.5s cubic-bezier(0, 0, 0.2, 1) infinite; }
        @keyframes user-ping { 75%, 100% { transform: scale(2); opacity: 0; } }
    </style>
</head>
<body class="w-screen h-screen relative">

    <!-- 1. 歡迎頁 -->
    <div id="splash-screen" class="fixed inset-0 z-[9999] flex flex-col items-center justify-center bg-slate-950">
        <div class="relative flex items-center justify-center w-32 h-32 mb-8">
            <div class="absolute inset-0 rounded-full border-2 border-cyan-500 pulse-ring"></div>
            <i class="ph ph-map-pin-line text-6xl text-cyan-400 drop-shadow-[0_0_15px_rgba(6,182,212,0.8)]"></i>
        </div>
        <h1 class="text-3xl font-bold tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 mb-2">清潔考核系統</h1>
        <p class="text-slate-400 tracking-widest text-sm uppercase">Smart Inspection System</p>
        <div class="mt-12 text-cyan-500/50 text-sm animate-pulse">系統載入中 System Loading...</div>
    </div>

    <!-- 1.5 密碼登入頁面 -->
    <div id="login-screen" class="fixed inset-0 z-[9998] flex flex-col items-center justify-center bg-slate-950/95 backdrop-blur-xl">
        <div class="glass-panel p-8 rounded-2xl flex flex-col items-center w-10/12 max-w-sm shadow-2xl border border-cyan-500/30">
            <div class="w-16 h-16 bg-cyan-500/20 rounded-full flex items-center justify-center mb-4">
                <i class="ph-fill ph-lock-key text-3xl text-cyan-400"></i>
            </div>
            <h2 class="text-xl font-bold text-white mb-2 tracking-widest">系統登入</h2>
            <p class="text-slate-400 text-sm mb-6">請輸入授權碼以存取資料</p>
            <input type="password" id="pwd-input" placeholder="請輸入密碼" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-4 py-3 text-white text-center tracking-widest focus:outline-none focus:border-cyan-400 mb-2 transition-colors">
            <p id="pwd-error" class="text-red-400 text-xs mb-4 h-4 opacity-0 transition-opacity">密碼錯誤，請重新輸入</p>
            <button onclick="checkPassword()" class="w-full bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-bold py-3 px-4 rounded-xl shadow-[0_0_15px_rgba(6,182,212,0.4)] transition-all active:scale-95 tracking-widest">
                進入系統
            </button>
        </div>
    </div>

    <!-- PWA 安裝提示 (選用) -->
    <div id="pwa-prompt" class="fixed top-4 left-4 right-4 z-[9997] bg-blue-600 text-white p-4 rounded-xl shadow-2xl flex items-start gap-3 hidden transition-transform translate-y-[-150%]">
        <i class="ph-fill ph-info text-2xl"></i>
        <div class="flex-1">
            <h4 class="font-bold mb-1">將系統加入主畫面</h4>
            <p class="text-sm opacity-90 leading-tight">點擊瀏覽器下方的「分享」按鈕，選擇「加入主畫面」，即可像 App 一樣全螢幕使用！</p>
        </div>
        <button onclick="document.getElementById('pwa-prompt').classList.add('hidden')" class="text-white opacity-70 hover:opacity-100"><i class="ph ph-x text-lg"></i></button>
    </div>

    <!-- 2. 主畫面 (地圖容器) -->
    <div id="map" class="absolute inset-0 z-0"></div>

    <!-- 2.5 清單模式 (List View) -->
    <div id="list-view" class="absolute inset-0 z-[5] bg-slate-950 overflow-y-auto hidden pt-[160px] pb-10 px-4">
        <h3 class="text-lg font-bold text-cyan-400 mb-4 flex items-center gap-2 border-b border-slate-800 pb-2"><i class="ph-fill ph-list-bullets"></i> 今日行程清單</h3>
        <div id="list-container" class="flex flex-col gap-3">
            <!-- JavaScript 動態生成清單 -->
        </div>
    </div>

    <!-- 3. UI 覆蓋層 (頂部與底部) -->
    <div id="ui-layer" class="absolute inset-0 z-10 pointer-events-none flex flex-col justify-between">
        
        <!-- 頂部：搜尋、進度、選單 -->
        <div class="pointer-events-auto w-full pt-4 px-4 pb-3 bg-gradient-to-b from-slate-950 via-slate-950/90 to-transparent">
            <!-- Title & View Toggle -->
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-xl font-bold flex items-center gap-2 text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-400">
                    <i class="ph-fill ph-target text-cyan-400"></i>
                    <span id="header-title">請選擇鄉鎮</span>
                </h2>
                <div class="flex gap-2">
                    <button class="glass w-10 h-10 rounded-full text-slate-300 hover:text-white flex justify-center items-center" onclick="toggleView()" id="btn-toggle-view">
                        <i class="ph-fill ph-list text-xl"></i>
                    </button>
                    <button class="glass w-10 h-10 rounded-full text-slate-300 hover:text-white flex justify-center items-center" onclick="map.fitBounds(currentBounds)">
                        <i class="ph ph-corners-out text-xl"></i>
                    </button>
                </div>
            </div>

            <!-- 全局搜尋列 -->
            <div class="relative w-full mb-3">
                <i class="ph ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-lg"></i>
                <input type="text" id="search-input" placeholder="搜尋南投縣考核路線或地點..." class="w-full bg-slate-800/80 border border-slate-700 rounded-full pl-10 pr-4 py-2 text-sm text-white focus:outline-none focus:border-cyan-400 transition-colors" oninput="handleSearch()">
                <!-- 搜尋結果下拉框 -->
                <div id="search-results" class="absolute top-full left-0 right-0 mt-1 bg-slate-800 rounded-xl shadow-2xl z-[50] hidden max-h-48 overflow-y-auto border border-slate-700"></div>
            </div>
            
            <!-- 鄉鎮橫向捲動選單 -->
            <div class="flex gap-2 overflow-x-auto no-scrollbar py-1 mb-2" id="township-selector"></div>

            <!-- 進度條 -->
            <div class="w-full px-1">
                <div class="flex justify-between text-[11px] text-slate-400 font-bold mb-1">
                    <span id="progress-text">本區考核進度：0/5</span>
                    <span id="progress-percent" class="text-cyan-400">0%</span>
                </div>
                <div class="w-full bg-slate-800 rounded-full h-1.5 overflow-hidden">
                    <div id="progress-bar" class="bg-gradient-to-r from-cyan-400 to-blue-500 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <!-- 底部：資訊面板 -->
        <div id="bottom-sheet" class="pointer-events-auto bottom-sheet hidden-sheet glass-panel w-full rounded-t-3xl p-5 pb-8 shadow-2xl max-h-[80vh] overflow-y-auto">
            <div class="w-12 h-1.5 bg-slate-600 rounded-full mx-auto mb-4 cursor-pointer" onclick="hideBottomSheet()"></div>
            
            <div id="sheet-content">
                <div class="flex justify-between items-start mb-2">
                    <h3 class="text-xl font-bold text-white pr-2" id="sheet-title">點位名稱</h3>
                    <!-- 狀態追蹤按鈕 (打卡) -->
                    <button id="mark-btn" class="shrink-0 flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm font-bold transition-all border" onclick="toggleItemStatus()">
                        <i class="ph-fill ph-check-circle text-lg"></i> <span id="mark-text">未考核</span>
                    </button>
                </div>
                <p class="text-sm text-slate-400 mb-5" id="sheet-desc">詳細資訊</p>
                
                <!-- 現場拍照區塊 -->
                <div class="mb-5 bg-slate-800/50 p-4 rounded-xl border border-slate-700">

                    <div id="photo-preview-container" class="hidden mb-3">
                        <img id="photo-preview" src="" class="w-full h-32 object-cover rounded-lg border border-slate-600">
                    </div>
                    <label class="w-full bg-slate-700 hover:bg-slate-600 text-white text-sm font-bold py-2 px-4 rounded-lg flex items-center justify-center gap-2 cursor-pointer transition-colors">
                        <i class="ph ph-upload-simple text-lg"></i> 拍攝或上傳照片
                        <input type="file" accept="image/*" capture="environment" class="hidden" onchange="handlePhotoUpload(event)">
                    </label>
                </div>

                <button id="nav-btn" class="w-full bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-bold py-3.5 px-4 rounded-xl flex items-center justify-center gap-2 shadow-[0_0_20px_rgba(6,182,212,0.3)] transition-all active:scale-95 hidden">
                    <i class="ph-fill ph-navigation-arrow text-xl"></i>
                    <span>開啟 Google Maps 導航</span>
                </button>
            </div>
        </div>

        <button id="locate-btn" class="pointer-events-auto absolute bottom-8 right-4 z-[1000] glass p-3 rounded-full text-cyan-400 hover:text-white hover:bg-slate-800 shadow-[0_0_15px_rgba(6,182,212,0.3)] transition-all active:scale-95" onclick="locateUser()">

        </button>
    </div>

                    { id: 3, name: "永隆村路線", start: [23.753367, 120.774639], end: [23.754037, 120.774393], color: "#84cc16" }
                ]
            },
            "jiji": {
                name: "集集鎮",
                office: { name: "集集鎮公所", lat: 23.828368, lng: 120.786489, type: "office" },
                restaurant: { name: "考核聚餐餐廳 (集集)", lat: 23.830368, lng: 120.788489, type: "restaurant" },
                routes: [
                    { id: 1, name: "田寮里路線", start: [23.836148, 120.750473], end: [23.834490, 120.750903], color: "#06b6d4" },
                    { id: 2, name: "集集社區路線", start: [23.830527, 120.783863], end: [23.829727, 120.782989], color: "#d946ef" },
                    { id: 3, name: "吳厝里路線", start: [23.828143, 120.787825], end: [23.826663, 120.788948], color: "#84cc16" }
                ]
            },
            "zhongliao": {
                name: "中寮鄉",
                office: { name: "中寮鄉公所", lat: 23.879003, lng: 120.766098, type: "office" },
                restaurant: { name: "考核聚餐餐廳 (中寮)", lat: 23.881003, lng: 120.768098, type: "restaurant" },
                routes: [
                    { id: 1, name: "永芳村路線", start: [23.930901, 120.743570], end: [23.931247, 120.747089], color: "#06b6d4" },
                    { id: 2, name: "清水村路線", start: [23.945351, 120.788934], end: [23.944242, 120.790283], color: "#d946ef" },
                    { id: 3, name: "龍岩村路線", start: [23.933321, 120.758229], end: [23.935202, 120.758507], color: "#84cc16" }
                ]
            },
            "renai": {
                name: "仁愛鄉",
                office: { name: "仁愛鄉公所", lat: 24.021544, lng: 121.132062, type: "office" },
                restaurant: { name: "考核聚餐餐廳 (仁愛)", lat: 24.023544, lng: 121.134062, type: "restaurant" },
                routes: [
                    { id: 1, name: "幼獅道班路線", start: [24.047794, 121.156327], end: [24.046639, 121.155915], color: "#06b6d4" },
                    { id: 2, name: "博望新村路線", start: [24.074991, 121.170174], end: [24.075177, 121.171519], color: "#d946ef" },
                    { id: 3, name: "壽亭新村路線", start: [24.041546, 121.160913], end: [24.041602, 121.160722], color: "#84cc16" }
                ]
            }
        };

        // --- 2. 狀態管理 (使用 LocalStorage 保存進度與照片) ---
        let inspectionState = JSON.parse(localStorage.getItem('nantou_inspection')) || {};
        let inspectionPhotos = JSON.parse(localStorage.getItem('nantou_photos')) || {};
        let currentTownshipId = null;
        let currentItemId = null; // 當前選取的點位ID

        function saveState() {
            localStorage.setItem('nantou_inspection', JSON.stringify(inspectionState));
            localStorage.setItem('nantou_photos', JSON.stringify(inspectionPhotos));
            updateProgressBar();
            if(!isListView) loadTownship(currentTownshipId); // 重新渲染地圖顏色
            else renderListView(); // 重新渲染清單
        }

        // --- 3. 地圖與 UI 核心 ---
        let map;
        let activeLayers = [];
        let currentBounds = null;
        let userMarker = null;
        let isListView = false;

        const createCustomIcon = (iconColor, iconName, opacity=1) => {
            return L.divIcon({
                className: 'custom-leaflet-icon',
                html: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" style="opacity:${opacity}">
                    <circle cx="20" cy="20" r="18" fill="rgba(15, 23, 42, 0.8)" stroke="${iconColor}" stroke-width="2"/>
                    ${opacity === 1 ? `<circle cx="20" cy="20" r="24" fill="none" stroke="${iconColor}" stroke-width="1" opacity="0.4" class="pulse"/>` : ''}
                    <foreignObject x="8" y="8" width="24" height="24">
                        <div xmlns="http://www.w3.org/1999/xhtml" style="display:flex; justify-content:center; align-items:center; height:100%; color:${iconColor}; font-size:18px;">
                            <i class="${iconName}"></i>
                        </div>
                    </foreignObject>
                </svg>`,
                iconSize: [40, 40], iconAnchor: [20, 20]
            });
        };

        function getIcons(isDone) {
            return {
                office: createCustomIcon(isDone ? '#64748b' : '#38bdf8', 'ph-fill ph-bank', isDone ? 0.6 : 1),
                restaurant: createCustomIcon(isDone ? '#64748b' : '#fbbf24', 'ph-fill ph-fork-knife', isDone ? 0.6 : 1),
                start: createCustomIcon(isDone ? '#64748b' : '#4ade80', 'ph-fill ph-flag-pennant', isDone ? 0.6 : 1),
                end: createCustomIcon(isDone ? '#64748b' : '#f87171', 'ph-fill ph-flag-checkered', isDone ? 0.6 : 1)
            };
        }

        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([23.903, 120.951], 10);
            L.control.zoom({ position: 'topright' }).addTo(map);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap', subdomains: 'abcd', maxZoom: 20
            }).addTo(map);
            
            map.on('zoomend', function() {
                const mapContainer = document.getElementById('map');
                if (map.getZoom() < 14) mapContainer.classList.add('hide-tooltips');
                else mapContainer.classList.remove('hide-tooltips');
            });
        }

        function loadTownship(id) {
            currentTownshipId = id;
            const data = mapData[id];
            if (!data) return;

            document.getElementById('header-title').innerText = `${data.name} 考核點位`;
            
            document.querySelectorAll('.township-btn').forEach(btn => {
                if(btn.dataset.id === id) {
                    btn.className = 'township-btn whitespace-nowrap px-4 py-2 rounded-full border text-sm font-medium transition-all backdrop-blur-md shadow-lg bg-cyan-600 border-cyan-400 text-white';
                } else {
                    btn.className = 'township-btn whitespace-nowrap px-4 py-2 rounded-full border text-sm font-medium transition-all backdrop-blur-md shadow-lg bg-slate-800/50 border-slate-600 text-slate-300';
                }
            });

            activeLayers.forEach(layer => map.removeLayer(layer));
            activeLayers = [];
            hideBottomSheet();
            updateProgressBar();

            const bounds = [];
            const drawPOI = (poi, itemId) => {
                const isDone = inspectionState[itemId];
                const marker = L.marker([poi.lat, poi.lng], { icon: getIcons(isDone)[poi.type] }).addTo(map);
                marker.on('click', () => showBottomSheet(poi.name, `類型：${poi.type === 'office'?'鄉鎮公所':'聚餐餐廳'}`, poi.lat, poi.lng, itemId));
                
                const colorClass = isDone ? 'text-slate-400' : (poi.type === 'office' ? 'text-sky-400' : 'text-amber-400');
                marker.bindTooltip(`<span class="${colorClass} font-bold">${poi.name}${isDone?' (已完成)':''}</span>`, { permanent: true, direction: 'top', className: 'glass-tooltip', offset: [0, -20] });
                activeLayers.push(marker); bounds.push([poi.lat, poi.lng]);
            };

            drawPOI(data.office, `${id}_office`);
            drawPOI(data.restaurant, `${id}_restaurant`);

            data.routes.forEach(route => {
                const itemId = `${id}_route_${route.id}`;
                const isDone = inspectionState[itemId];
                const routeColor = isDone ? '#475569' : route.color;
                const opacity = isDone ? 0.5 : 0.8;

                const polyline = L.polyline([route.start, route.end], { color: routeColor, weight: 5, opacity: opacity, dashArray: '10, 10' }).addTo(map);
                const startMarker = L.marker(route.start, { icon: getIcons(isDone).start }).addTo(map);
                const endMarker = L.marker(route.end, { icon: getIcons(isDone).end }).addTo(map);

                const openSheet = () => showBottomSheet(route.name, `狀態：${isDone?'已考核':'未考核'}`, route.start[0], route.start[1], itemId);
                polyline.on('click', openSheet); startMarker.on('click', openSheet); endMarker.on('click', openSheet);
                
                startMarker.bindTooltip(`<div class="${isDone?'text-slate-400':'text-green-400'} font-bold mb-0.5">🟢 起點</div><div class="text-slate-200">${route.name}</div>`, { permanent: true, direction: 'right', className: 'glass-tooltip text-center', offset: [15, 0] });
                endMarker.bindTooltip(`<div class="${isDone?'text-slate-400':'text-red-400'} font-bold mb-0.5">🏁 終點</div><div class="text-slate-200">${route.name}</div>`, { permanent: true, direction: 'left', className: 'glass-tooltip text-center', offset: [-15, 0] });

                activeLayers.push(polyline, startMarker, endMarker);
                bounds.push(route.start, route.end);
            });

            if (bounds.length > 0) {
                currentBounds = L.latLngBounds(bounds);
                map.fitBounds(currentBounds, { padding: [50, 50], animate: true, duration: 1 });
            }
        }

        // --- 4. 進度條與狀態切換 ---
        function updateProgressBar() {
            if(!currentTownshipId) return;
            const data = mapData[currentTownshipId];
            const totalItems = 2 + data.routes.length; // 公所 + 餐廳 + 路線數
            let completedItems = 0;
            
            if(inspectionState[`${currentTownshipId}_office`]) completedItems++;
            if(inspectionState[`${currentTownshipId}_restaurant`]) completedItems++;
            data.routes.forEach(r => { if(inspectionState[`${currentTownshipId}_route_${r.id}`]) completedItems++; });

            const pct = Math.round((completedItems / totalItems) * 100);
            document.getElementById('progress-text').innerText = `本區進度：${completedItems} / ${totalItems} 點位`;
            document.getElementById('progress-percent').innerText = `${pct}%`;
            document.getElementById('progress-bar').style.width = `${pct}%`;
        }

        function toggleItemStatus() {
            if(!currentItemId) return;
            inspectionState[currentItemId] = !inspectionState[currentItemId];
            
            // 更新按鈕外觀
            const btn = document.getElementById('mark-btn');
            const text = document.getElementById('mark-text');
            if(inspectionState[currentItemId]) {
                btn.className = "shrink-0 flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm font-bold transition-all bg-emerald-500/20 border-emerald-500 text-emerald-400";
                text.innerText = "已考核";
            } else {
                btn.className = "shrink-0 flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm font-bold transition-all bg-slate-800 border-slate-600 text-slate-300";
                text.innerText = "未考核";
            }
            saveState();
        }

        // --- 5. 現場拍照功能 (Canvas 壓縮) ---
        function handlePhotoUpload(event) {
            const file = event.target.files[0];
            if(!file || !currentItemId) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 600; // 壓縮尺寸以符合 localStorage 限制
                    let width = img.width;
                    let height = img.height;
                    if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    const base64Data = canvas.toDataURL('image/jpeg', 0.6);
                    inspectionPhotos[currentItemId] = base64Data;
                    saveState();
                    
                    // 顯示預覽
                    document.getElementById('photo-preview-container').classList.remove('hidden');
                    document.getElementById('photo-preview').src = base64Data;
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // --- 6. 底部面板控制 ---
        const bottomSheet = document.getElementById('bottom-sheet');
        function showBottomSheet(title, desc, lat, lng, itemId) {
            currentItemId = itemId;
            document.getElementById('sheet-title').innerText = title;
            document.getElementById('sheet-desc').innerHTML = desc;
            
            // 檢查狀態
            const isDone = inspectionState[itemId];
            const btn = document.getElementById('mark-btn');
            const text = document.getElementById('mark-text');
            if(isDone) {
                btn.className = "shrink-0 flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm font-bold transition-all bg-emerald-500/20 border-emerald-500 text-emerald-400";
                text.innerText = "已考核";
            } else {
                btn.className = "shrink-0 flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm font-bold transition-all bg-slate-800 border-slate-600 text-slate-300";
                text.innerText = "未考核";
            }

            // 檢查照片
            if(inspectionPhotos[itemId]) {
                document.getElementById('photo-preview-container').classList.remove('hidden');
                document.getElementById('photo-preview').src = inspectionPhotos[itemId];
            } else {
                document.getElementById('photo-preview-container').classList.add('hidden');
            }
            
            const navBtn = document.getElementById('nav-btn');
            navBtn.classList.remove('hidden');
            navBtn.onclick = () => { window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`, '_blank'); };
            
            bottomSheet.classList.remove('hidden-sheet');
        }
        function hideBottomSheet() { bottomSheet.classList.add('hidden-sheet'); currentItemId = null; }

        // --- 7. 清單模式與雙模切換 ---
        function toggleView() {
            isListView = !isListView;
            const listEl = document.getElementById('list-view');
            const btnIcon = document.querySelector('#btn-toggle-view i');
            hideBottomSheet();

            if (isListView) {
                listEl.classList.remove('hidden');
                btnIcon.className = "ph-fill ph-map-trifold text-xl text-cyan-400"; // 切換為地圖圖示
                renderListView();
            } else {
                listEl.classList.add('hidden');
                btnIcon.className = "ph-fill ph-list text-xl"; // 切換回清單圖示
                map.invalidateSize(); // 修復 Leaflet 尺寸問題
            }
        }

        function renderListView(filterText = "") {
            const container = document.getElementById('list-container');
            container.innerHTML = '';
            
            const renderItem = (title, type, lat, lng, itemId, tId) => {
                if (filterText && !title.includes(filterText) && !mapData[tId].name.includes(filterText)) return;
                
                const isDone = inspectionState[itemId];
                const hasPhoto = !!inspectionPhotos[itemId];
                
                container.innerHTML += `
                    <div class="bg-slate-900 border ${isDone ? 'border-emerald-500/30' : 'border-slate-700'} p-4 rounded-xl shadow-lg flex items-center justify-between cursor-pointer active:scale-95 transition-transform" onclick="jumpToMap('${tId}', '${itemId}', ${lat}, ${lng}, '${title}')">
                        <div>
                            <div class="text-xs text-slate-400 mb-1 flex gap-2">
                                <span class="bg-slate-800 px-2 py-0.5 rounded">${mapData[tId].name}</span>
                                ${isDone ? '<span class="text-emerald-400"><i class="ph-fill ph-check-circle"></i> 已完勘</span>' : ''}
                                ${hasPhoto ? '<span class="text-amber-400"><i class="ph-fill ph-camera"></i> 有照片</span>' : ''}
                            </div>
                            <h4 class="text-white font-bold text-lg">${title}</h4>
                        </div>
                        <div class="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center text-cyan-400">
                            <i class="ph-fill ph-navigation-arrow text-lg"></i>
                        </div>
                    </div>
                `;
            };

            // 如果有搜尋字串，就搜全縣；如果沒有，只顯示當前鄉鎮
            const targets = filterText ? Object.keys(mapData) : [currentTownshipId];
            
            targets.forEach(tId => {
                const d = mapData[tId];
                renderItem(d.office.name, 'office', d.office.lat, d.office.lng, `${tId}_office`, tId);
                d.routes.forEach(r => renderItem(r.name, 'route', r.start[0], r.start[1], `${tId}_route_${r.id}`, tId));
                renderItem(d.restaurant.name, 'restaurant', d.restaurant.lat, d.restaurant.lng, `${tId}_restaurant`, tId);
            });

            if(container.innerHTML === '') container.innerHTML = '<p class="text-slate-500 text-center py-10">找不到符合的地點或路線</p>';
        }

        function jumpToMap(tId, itemId, lat, lng, title) {
            if (isListView) toggleView();
            if (tId !== currentTownshipId) loadTownship(tId);
            map.flyTo([lat, lng], 16, { animate: true, duration: 1 });
            setTimeout(() => showBottomSheet(title, '從清單快速跳轉', lat, lng, itemId), 1000);
        }

        // --- 8. 全局搜尋 ---
        function handleSearch() {
            const input = document.getElementById('search-input').value.trim();
            const resultBox = document.getElementById('search-results');
            
            if (input.length === 0) {
                resultBox.classList.add('hidden');
                if (isListView) renderListView(); // 恢復清單
                return;
            }

            if (isListView) {
                // 如果在清單模式，直接過濾清單
                renderListView(input);
            } else {
                // 地圖模式下，顯示下拉選單
                resultBox.innerHTML = '';
                let count = 0;
                Object.keys(mapData).forEach(tId => {
                    const d = mapData[tId];
                    const checkAdd = (name, lat, lng, itemId) => {
                        if (name.includes(input) || d.name.includes(input)) {
                            count++;
                            resultBox.innerHTML += `
                                <div class="px-4 py-3 hover:bg-slate-700 cursor-pointer border-b border-slate-700 last:border-0" onclick="jumpToMap('${tId}', '${itemId}', ${lat}, ${lng}, '${name}'); document.getElementById('search-results').classList.add('hidden');">
                                    <div class="text-xs text-cyan-400 mb-0.5">${d.name}</div>
                                    <div class="text-white font-medium">${name}</div>
                                </div>
                            `;
                        }
                    };
                    checkAdd(d.office.name, d.office.lat, d.office.lng, `${tId}_office`);
                    d.routes.forEach(r => checkAdd(r.name, r.start[0], r.start[1], `${tId}_route_${r.id}`));
                    checkAdd(d.restaurant.name, d.restaurant.lat, d.restaurant.lng, `${tId}_restaurant`);
                });
                
                if (count > 0) resultBox.classList.remove('hidden');
                else {
                    resultBox.innerHTML = '<div class="px-4 py-3 text-slate-500 text-sm">無符合結果</div>';
                    resultBox.classList.remove('hidden');
                }
            }
        }

        // --- 9. 初始化與密碼登入 ---
        const SYSTEM_PASSWORD = "54004658"; 

        function checkPassword() {
            const input = document.getElementById('pwd-input').value;
            const errorMsg = document.getElementById('pwd-error');
            
            if (input === SYSTEM_PASSWORD) {
                errorMsg.style.opacity = '0';
                const loginScreen = document.getElementById('login-screen');
                loginScreen.style.opacity = '0';
                
                // 檢查是否顯示 PWA 提示 (第一次登入且未加到桌面時)
                const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
                if (!isStandalone && !localStorage.getItem('pwa_prompt_shown')) {
                    setTimeout(() => {
                        const prompt = document.getElementById('pwa-prompt');
                        prompt.classList.remove('hidden');
                        setTimeout(() => prompt.classList.remove('translate-y-[-150%]'), 100);
                        localStorage.setItem('pwa_prompt_shown', 'true');
                    }, 2000);
                }

                setTimeout(() => { loginScreen.style.display = 'none'; }, 500);
            } else {
                errorMsg.style.opacity = '1';
                document.getElementById('pwd-input').value = '';
            }
        }

        window.onload = () => {
            initMap();
            
            const selector = document.getElementById('township-selector');
            Object.keys(mapData).forEach((id, index) => {
                const btn = document.createElement('button');
                btn.dataset.id = id;
                btn.innerText = mapData[id].name;
                btn.onclick = () => loadTownship(id);
                selector.appendChild(btn);
            });
            
            loadTownship(Object.keys(mapData)[0]);

            document.getElementById('pwd-input').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') checkPassword();
            });

            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                setTimeout(() => splash.style.display = 'none', 500);
            }, 1500);
        };
        
        // --- 10. GPS 精準定位功能 ---
        function locateUser() {
            const btnIcon = document.querySelector('#locate-btn i');
            btnIcon.className = "ph ph-spinner animate-spin text-2xl text-amber-400"; 
            if (!navigator.geolocation) return alert("您的瀏覽器不支援地理定位功能！");
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude; const lng = position.coords.longitude;
                    if (userMarker) map.removeLayer(userMarker);
                    userMarker = L.marker([lat, lng], { icon: L.divIcon({ className: 'custom-user-icon', html: `<div class="relative"><div class="user-pulse"></div><div class="user-location-marker"></div></div>`, iconSize: [16, 16], iconAnchor: [8, 8] }), zIndexOffset: 1000 }).addTo(map);
                    userMarker.bindTooltip('<span class="text-blue-300 font-bold">📍 我的位置</span>', { permanent: true, direction: 'top', className: 'glass-tooltip', offset: [0, -10] });
                    map.flyTo([lat, lng], 16, { animate: true, duration: 1.5 });
                    btnIcon.className = "ph-fill ph-crosshair text-2xl text-cyan-400"; 
                },
                (error) => { alert("無法獲取位置！請開啟 GPS 與權限。"); btnIcon.className = "ph-fill ph-crosshair text-2xl text-cyan-400"; },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }
    </script>
</body>
